name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify OpenAI cost attribution
        run: node scripts/check-openai-cost-attribution.mjs
      - name: Lint changed integration files
        run: >-
          npx eslint
          src/lib/priceAdjustmentIntegrationAuth.ts
          src/app/api/integrations/price-adjustment/jobs/route.ts
          'src/app/api/integrations/price-adjustment/jobs/[jobId]/route.ts'
          src/lib/extendedModuleRegistry.ts
          src/lib/productLaunchTrackerRows.ts
          src/lib/productLaunchTrackerShopling.ts
          src/lib/tossCompatibleOption.ts
          src/app/api/product-launch-tracker/model-order-options/route.ts
          src/app/api/product-launch-tracker/flow-selection/route.ts
          src/components/product-launch-flow/ProductLaunchFlowConnected.tsx
          src/components/product-launch-flow/ProductLaunchTrackerHandoffSync.tsx
          src/lib/productMasterShoplingSalesBackfillEngine.ts
          src/lib/productMasterShoplingSalesBackfill.ts
          src/lib/productMasterShoplingSalesIncrementalEngine.ts
          src/lib/productMasterShoplingSalesIncremental.ts
          src/lib/productMasterShoplingSalesHistoricalShadowEngine.ts
          src/lib/productMasterShoplingSalesHistoricalShadow.ts
          src/lib/productMasterShoplingSalesDirectCodeEvidenceEngine.ts
          src/lib/productMasterShoplingSalesDirectCodeEvidence.ts
          src/lib/productMasterShoplingSalesEventEngine.ts
          src/lib/productMasterShoplingSalesEventSync.ts
          src/lib/productMasterCanonicalSalesAudit.ts
          src/lib/productMasterInventoryCostReadiness.ts
          src/lib/stage8CanonicalDemandParity.ts
          src/lib/stage8DemandMismatchEvidenceEngine.ts
          src/lib/stage8DemandMismatchEvidence.ts
          src/lib/stage8CandidateDemandParity.ts
          src/lib/stage8CandidateMismatchEvidence.ts
          src/lib/stage8CandidatePromotionGate.ts
          src/lib/stage8PostApplyCanonicalReconciliation.ts
          src/lib/stage8InventoryVerificationPriority.ts
          src/lib/stage8ProvisionalInventorySourceAudit.ts
          src/lib/stage8LegacyOrderSurrogateValidation.ts
          src/lib/stage8HistoricalSalesCoverageAudit.ts
          src/lib/stage8LegacySalesGapLiveAudit.ts
          src/lib/stage8LatestOrderProvisionalValidation.ts
          src/data/stage8ProvisionalInventoryValidationEvidence.ts
          src/data/stage8LegacyOrderSurrogateValidationEvidence.ts
          src/lib/shopling/shoplingCurrentPriceResolver.ts
          src/lib/shopling/shoplingCurrentPrice.ts
          src/lib/stage8ShoplingReceiptPriceReadiness.ts
          src/lib/confirmedReceiptBatchSource.ts
          src/lib/receiptLivePriceProposal.ts
          src/lib/receiptLivePriceProposalWorker.ts
          src/app/api/cron/product-master-shopling-sales-backfill/route.ts
          src/app/api/cron/product-master-shopling-sales-events/route.ts
          src/app/api/cron/stage8-canonical-demand-parity/route.ts
          src/app/api/cron/receipt-live-price-proposals/route.ts
          src/app/api/product-master/shopling-sales-events/route.ts
          src/app/api/stage8/canonical-demand-parity/route.ts
          src/app/api/stage8/demand-mismatch-evidence/route.ts
          src/app/api/stage8/candidate-demand-parity/route.ts
          src/app/api/stage8/candidate-mismatch-evidence/route.ts
          src/app/product-master/shopling-sales-backfill/historical-shadow/page.tsx
          src/app/product-master/shopling-sales-backfill/direct-code-evidence/page.tsx
          src/app/stage8-sales-events/page.tsx
          src/app/stage8-sales-events/SalesEventSyncControls.tsx
          src/app/stage8-canonical-sales-audit/page.tsx
          src/app/stage8-demand-parity/page.tsx
          src/app/stage8-demand-mismatch-evidence/page.tsx
          src/app/stage8-candidate-demand-parity/page.tsx
          src/app/stage8-candidate-mismatch-evidence/page.tsx
          src/app/stage8-candidate-promotion-gate/page.tsx
          src/app/stage8-postapply-canonical-reconciliation/page.tsx
          src/app/stage8-inventory-verification-priority/page.tsx
          src/app/stage8-provisional-inventory-source-audit/page.tsx
          src/app/stage8-legacy-order-surrogate-validation/page.tsx
          src/app/stage8-historical-sales-coverage-audit/page.tsx
          src/app/stage8-legacy-sales-gap-live-audit/page.tsx
          src/app/stage8-latest-order-provisional-validation/page.tsx
          src/app/stage8-shopling-receipt-price-readiness/page.tsx
          src/app/stage8-receipt-live-price-proposals/page.tsx
      - name: Test existing bulk safety and new engine integration
        run: >-
          node --experimental-strip-types --test
          tests/opsLoginBypass.test.mjs
          tests/shoplingPriceAdjustmentAuth.test.mjs
          tests/shoplingPriceAdjustmentBatchCanary.test.mjs
          tests/shoplingPriceAdjustmentIdentity.test.mjs
          tests/shoplingPriceAdjustmentInputModes.test.mjs
          tests/shoplingPriceAdjustmentPartialPlan.test.mjs
          tests/shoplingPriceAdjustmentRecoveryStatic.test.mjs
          tests/shoplingPriceAdjustmentWorkflowFailure.test.mjs
          tests/priceAdjustmentEngineIntegration.test.mjs
      - name: Test managed Shopling sales scope and historical evidence safety
        run: >-
          node --experimental-strip-types --test
          tests/productMasterShoplingSalesBackfillEngine.test.mjs
          tests/productMasterShoplingSalesUnmappedContext.test.mjs
          tests/productMasterShoplingSalesIncremental.test.mjs
          tests/productMasterShoplingSalesHistoricalShadowEngine.test.mjs
          tests/productMasterShoplingSalesHistoricalShadow.test.mjs
          tests/productMasterShoplingSalesDirectCodeEvidenceEngine.test.mjs
          tests/productMasterShoplingSalesDirectCodeEvidence.test.mjs
          tests/productMasterShoplingSalesEventEngine.test.mjs
          tests/productMasterShoplingSalesEventSync.test.mjs
          tests/productMasterCanonicalSalesAudit.test.mjs
          tests/stage8CanonicalDemandParity.test.mjs
          tests/stage8DemandMismatchEvidence.test.mjs
          tests/stage8CandidateDemandParity.test.mjs
          tests/stage8CandidateMismatchEvidence.test.mjs
          tests/stage8CandidatePromotionGate.test.mjs
          tests/stage8PostApplyCanonicalReconciliation.test.mjs
          tests/stage8InventoryVerificationPriority.test.mjs
          tests/stage8ProvisionalInventorySourceAudit.test.mjs
          tests/stage8LegacyOrderSurrogateValidation.test.mjs
          tests/stage8HistoricalSalesCoverageAudit.test.mjs
          tests/stage8LegacySalesGapLiveAudit.test.mjs
          tests/stage8LatestOrderProvisionalValidation.test.mjs
          tests/shoplingCurrentPrice.test.mjs
          tests/stage8ShoplingReceiptPriceReadiness.test.mjs
          tests/confirmedReceiptBatchSource.test.mjs
          tests/receiptLivePriceProposal.test.mjs
          tests/receiptLivePriceProposalWorker.test.mjs
      - name: Test tracker-connected product launch flow
        run: >-
          node --experimental-strip-types --test
          tests/productLaunchTrackerRows.test.mjs
          tests/productLaunchTrackerBarcodeMapping.test.mjs
          tests/productLaunchTrackerFlowConnection.test.mjs
          tests/tossCompatibleOption.test.mjs
          tests/seoBulkCloudParallel.test.mjs
          tests/seoGroundedReservoirV11.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36