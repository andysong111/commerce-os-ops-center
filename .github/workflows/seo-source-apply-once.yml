name: Apply isolated SEO source patch
on:
  push:
    branches: [fix/general-seo-source-chain-20260916]
    paths: [.github/workflows/seo-source-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/general-seo-source-chain-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/general-seo-source-chain-20260916
      - name: Verify and unpack reviewed source patch
        shell: python
        run: |
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('scripts/seo-source-fallback-change.patch.gz.b64').read_text().strip()
          missing = ''
          encoded = encoded.replace('A1MEBiOCRjsT2R6BMm+CBpao', 'A1MEBiOCRjs' + missing + 'T2R6BMm+CBpao')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bd3df7343bd75b481f4995736708e61a2f5b681b8da27bb9f76ac99cf15b64e7', 'Patch integrity mismatch; no source changes allowed'
          Path('/tmp/seo-source-fallback.patch').write_bytes(patch)
      - name: Apply exact patch and remove one-time transport files
        run: |
          git apply --check /tmp/seo-source-fallback.patch
          git apply --index /tmp/seo-source-fallback.patch
          git rm .github/workflows/seo-source-apply-once.yml scripts/seo-source-fallback-change.patch.gz.b64
          git diff --cached --check
          git config user.name andysong111
          git config user.email 220983550+andysong111@users.noreply.github.com
          git commit -m "fix(seo): chain 1688, verified Shopling and tracker seeds for general bulk RUNs"
          git push origin HEAD:fix/general-seo-source-chain-20260916
          git rev-parse HEAD
