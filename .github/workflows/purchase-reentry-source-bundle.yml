name: Purchase Recovery Source Fixture
on:
  push:
    branches: [fix/purchase-reentry-source-recovery-20260914]
    paths: [.github/workflows/purchase-reentry-source-bundle.yml]
permissions:
  contents: read
jobs:
  source-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm ci --ignore-scripts
      - name: Bundle tracked source and compiler without Git credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/purchase-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/purchase-source"
          mkdir -p "$RUNNER_TEMP/purchase-source/node_modules"
          cp -R node_modules/typescript "$RUNNER_TEMP/purchase-source/node_modules/typescript"
          rm -rf "$RUNNER_TEMP/purchase-source/.git"
          find "$RUNNER_TEMP/purchase-source" -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) -delete
          tar -czf "$RUNNER_TEMP/purchase-source.tgz" -C "$RUNNER_TEMP/purchase-source" .
      - uses: actions/upload-artifact@v4
        with:
          name: purchase-recovery-source-fixture
          path: ${{ runner.temp }}/purchase-source.tgz
          retention-days: 1
