name: Apply isolated SEO application patch
on:
  push:
    branches: [fix/general-seo-source-chain-20260916]
    paths: [.github/workflows/seo-source-apply-final.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/general-seo-source-chain-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/general-seo-source-chain-20260916
      - name: Unpack existing hash-verified patch
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          body = Path('.github/workflows/seo-source-apply-once.yml').read_text()
          script = body.split('shell: python\n        run: |\n', 1)[1].split('\n      - name: Apply exact patch', 1)[0]
          exec(compile(dedent(script), 'verified-patch-unpack', 'exec'))
      - name: Apply application changes only
        run: |
          git apply --check --exclude='.github/workflows/*' /tmp/seo-source-fallback.patch
          git apply --index --exclude='.github/workflows/*' /tmp/seo-source-fallback.patch
          git rm scripts/seo-source-fallback-change.patch.gz.b64
          git diff --cached --check
          git config user.name andysong111
          git config user.email 220983550+andysong111@users.noreply.github.com
          git commit -m "fix(seo): chain 1688 Shopling tracker sources for general bulk"
          git push origin HEAD:fix/general-seo-source-chain-20260916
          git rev-parse HEAD
