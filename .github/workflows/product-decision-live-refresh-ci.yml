name: Product Decision Live Refresh CI

on:
  pull_request:
    paths:
      - "src/lib/productDecisionLiveRefresh.ts"
      - "src/lib/productDecisionMonthlyArchive.ts"
      - "src/lib/monthlyPurchasePolicy.ts"
      - "src/lib/monthlyPurchaseCycleGate.ts"
      - "src/lib/shopling/calendarMonthRevenue.ts"
      - "src/lib/stage8CanonicalPurchaseShadow.ts"
      - "src/lib/purchaseSalesFreshness.ts"
      - "src/app/api/product-decision-agent/live-refresh/**"
      - "src/app/api/cron/product-decision-live-refresh/**"
      - "src/app/product-decision-agent/page.tsx"
      - "src/app/product-decision-agent/live-refresh/**"
      - "tests/productDecisionLiveRefreshWorker.test.mjs"
      - "tests/productDecisionMonthlyArchive.test.mjs"
      - "tests/monthlyPurchasePolicy.test.mjs"
      - "tests/stage8CanonicalPurchaseShadow.test.mjs"
      - "vercel.json"
      - ".github/workflows/product-decision-live-refresh-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-decision-live-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-refresh-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint monthly purchase workflow
        run: >-
          npx eslint
          src/lib/productDecisionLiveRefresh.ts
          src/lib/productDecisionMonthlyArchive.ts
          src/lib/monthlyPurchasePolicy.ts
          src/lib/monthlyPurchaseCycleGate.ts
          src/lib/shopling/calendarMonthRevenue.ts
          src/lib/stage8CanonicalPurchaseShadow.ts
          src/lib/purchaseSalesFreshness.ts
          src/app/api/product-decision-agent/live-refresh/route.ts
          src/app/api/cron/product-decision-live-refresh/route.ts
          src/app/product-decision-agent/page.tsx
          src/app/product-decision-agent/live-refresh/page.tsx
          src/app/product-decision-agent/live-refresh/LiveRefreshControl.tsx
          tests/productDecisionLiveRefreshWorker.test.mjs
          tests/productDecisionMonthlyArchive.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/stage8CanonicalPurchaseShadow.test.mjs
      - name: Run monthly purchase workflow tests
        run: >-
          node --experimental-strip-types --test
          tests/productDecisionLiveRefreshWorker.test.mjs
          tests/productDecisionMonthlyArchive.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/stage8CanonicalPurchaseShadow.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://product-decision-live-refresh-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_product_decision_live_refresh_build_check
          SUPABASE_SECRET_KEY: sb_secret_product_decision_live_refresh_build_check
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
          SHOPLING_LOGIN_ID: ci-shopling-id
          SHOPLING_COMPANY_ID: ci-shopling-company
          SHOPLING_API_AUTH_KEY: ci-shopling-key
          CRON_SECRET: ci-cron-secret
