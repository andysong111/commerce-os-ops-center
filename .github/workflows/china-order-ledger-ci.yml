name: China Order Ledger CI

on:
  pull_request:
    paths:
      - "src/lib/chinaOrderLedger.ts"
      - "src/lib/internalChinaPurchaseDraft.ts"
      - "src/lib/internalChinaOrderEvidence.ts"
      - "src/lib/internalChinaPurchaseBudgetAudit.ts"
      - "src/lib/internalChinaReceipt.ts"
      - "src/lib/internalChinaForwarderCost.ts"
      - "src/lib/internalChinaForwarderStoredClose.ts"
      - "src/lib/internalChinaFundingClose.ts"
      - "src/lib/internalChinaPurchaseCycleHandoff.ts"
      - "src/lib/internalChinaCostPricePolicy.ts"
      - "src/lib/internalChinaCostPriceReview.ts"
      - "src/lib/internalChinaPriceGroupPolicy.ts"
      - "src/lib/internalChinaGroupCostPricePolicy.ts"
      - "src/lib/internalChinaGroupCostPriceReview.ts"
      - "src/lib/internalChinaShoplingSaleStatus.ts"
      - "src/lib/shopling/shoplingProductGroupRegistry.ts"
      - "src/lib/shopling/historicalProductGroupXlsx.ts"
      - "src/lib/shopling/historicalProductGroupImport.ts"
      - "src/lib/productMasterCanonicalSync.ts"
      - "src/lib/productMasterCanonicalBatchContext.ts"
      - "src/lib/monthlyPurchasePolicy.ts"
      - "src/lib/monthlyPurchaseDraftConsolidation.ts"
      - "src/lib/monthlyPurchaseDraftDisplayMetadata.ts"
      - "src/lib/shopling/calendarMonthRevenue.ts"
      - "src/app/api/china-order-ledger/**"
      - "src/app/api/china-order-manager/**"
      - "src/app/api/cron/receipt-live-price-proposals/route.ts"
      - "src/app/china-order-manager/**"
      - "src/app/fast-purchase-mvp/page.tsx"
      - "src/components/china-order-manager/**"
      - "src/components/fast-purchase-mvp/FastPurchaseDraftActions.tsx"
      - "src/components/fast-purchase-mvp/PreviousPurchaseCycleHandoff.tsx"
      - "tests/chinaOrderLedger.test.mjs"
      - "tests/internalChinaPurchaseDraftMvp.test.mjs"
      - "tests/internalChinaOrderEvidence.test.mjs"
      - "tests/internalChinaPurchaseBudgetAudit.test.mjs"
      - "tests/internalChinaReceipt.test.mjs"
      - "tests/internalChinaForwarderCost.test.mjs"
      - "tests/internalChinaFundingClose.test.mjs"
      - "tests/internalChinaPurchaseCycleHandoff.test.mjs"
      - "tests/internalChinaCostPriceReview.test.mjs"
      - "tests/internalChinaGroupCostPriceV2.test.mjs"
      - "tests/productMasterCanonicalBatchContext.test.mjs"
      - "tests/monthlyPurchasePolicy.test.mjs"
      - "tests/monthlyPurchaseDraftConsolidation.test.mjs"
      - ".github/workflows/china-order-ledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-order-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint China order ledger and monthly purchase budget
        run: >-
          npx eslint
          src/lib/chinaOrderLedger.ts
          src/lib/internalChinaPurchaseDraft.ts
          src/lib/internalChinaOrderEvidence.ts
          src/lib/internalChinaPurchaseBudgetAudit.ts
          src/lib/internalChinaReceipt.ts
          src/lib/internalChinaForwarderCost.ts
          src/lib/internalChinaForwarderStoredClose.ts
          src/lib/internalChinaFundingClose.ts
          src/lib/internalChinaPurchaseCycleHandoff.ts
          src/lib/internalChinaCostPricePolicy.ts
          src/lib/internalChinaCostPriceReview.ts
          src/lib/internalChinaPriceGroupPolicy.ts
          src/lib/internalChinaGroupCostPricePolicy.ts
          src/lib/internalChinaGroupCostPriceReview.ts
          src/lib/internalChinaShoplingSaleStatus.ts
          src/lib/shopling/shoplingProductGroupRegistry.ts
          src/lib/shopling/historicalProductGroupXlsx.ts
          src/lib/shopling/historicalProductGroupImport.ts
          src/lib/productMasterCanonicalSync.ts
          src/lib/productMasterCanonicalBatchContext.ts
          src/lib/monthlyPurchasePolicy.ts
          src/lib/monthlyPurchaseDraftConsolidation.ts
          src/lib/monthlyPurchaseDraftDisplayMetadata.ts
          src/lib/shopling/calendarMonthRevenue.ts
          src/app/api/china-order-ledger/events/route.ts
          "src/app/api/china-order-manager/drafts/[draftId]/route.ts"
          src/app/api/china-order-manager/monthly-finalize/route.ts
          src/app/api/china-order-manager/receipts/route.ts
          src/app/api/china-order-manager/forwarder-cost/route.ts
          src/app/api/china-order-manager/funding-close/route.ts
          src/app/api/china-order-manager/price-review/approve/route.ts
          src/app/api/china-order-manager/price-review/group-aware-approve/route.ts
          src/app/api/china-order-manager/price-review/product-groups/import/route.ts
          src/app/api/cron/receipt-live-price-proposals/route.ts
          src/app/china-order-manager/layout.tsx
          src/app/china-order-manager/page.tsx
          src/app/china-order-manager/price-review/page.tsx
          "src/app/china-order-manager/drafts/[draftId]/page.tsx"
          src/app/fast-purchase-mvp/page.tsx
          src/components/china-order-manager/InternalChinaPurchaseDraftWorkspace.tsx
          src/components/china-order-manager/InternalChinaPurchaseDraftWorkspaceV2.tsx
          src/components/china-order-manager/InternalChinaPurchaseBudgetAudit.tsx
          src/components/china-order-manager/InternalChinaReceiptPanel.tsx
          src/components/china-order-manager/InternalChinaForwarderCloseHistory.tsx
          src/components/china-order-manager/InternalChinaForwarderCostFallback.tsx
          src/components/china-order-manager/InternalChinaFundingClosePanel.tsx
          src/components/china-order-manager/InternalChinaCostPriceApprovalButton.tsx
          src/components/china-order-manager/InternalChinaGroupCostPriceApprovalButton.tsx
          src/components/china-order-manager/InternalChinaHistoricalProductGroupImport.tsx
          src/components/china-order-manager/MonthlyDraftConsolidation.tsx
          src/components/fast-purchase-mvp/FastPurchaseDraftActions.tsx
          src/components/fast-purchase-mvp/PreviousPurchaseCycleHandoff.tsx
          tests/chinaOrderLedger.test.mjs
          tests/internalChinaPurchaseDraftMvp.test.mjs
          tests/internalChinaOrderEvidence.test.mjs
          tests/internalChinaPurchaseBudgetAudit.test.mjs
          tests/internalChinaReceipt.test.mjs
          tests/internalChinaForwarderCost.test.mjs
          tests/internalChinaFundingClose.test.mjs
          tests/internalChinaPurchaseCycleHandoff.test.mjs
          tests/internalChinaCostPriceReview.test.mjs
          tests/internalChinaGroupCostPriceV2.test.mjs
          tests/productMasterCanonicalBatchContext.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/monthlyPurchaseDraftConsolidation.test.mjs
      - name: Run China order ledger and monthly budget tests
        run: >-
          node --experimental-strip-types --test
          tests/chinaOrderLedger.test.mjs
          tests/internalChinaPurchaseDraftMvp.test.mjs
          tests/internalChinaOrderEvidence.test.mjs
          tests/internalChinaPurchaseBudgetAudit.test.mjs
          tests/internalChinaReceipt.test.mjs
          tests/internalChinaForwarderCost.test.mjs
          tests/internalChinaFundingClose.test.mjs
          tests/internalChinaPurchaseCycleHandoff.test.mjs
          tests/internalChinaCostPriceReview.test.mjs
          tests/internalChinaGroupCostPriceV2.test.mjs
          tests/productMasterCanonicalBatchContext.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/monthlyPurchaseDraftConsolidation.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://china-order-ledger-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_china_order_ledger_build_check
          SUPABASE_SECRET_KEY: sb_secret_china_order_ledger_build_check
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
          SHOPLING_LOGIN_ID: ci-shopling-id
          SHOPLING_COMPANY_ID: ci-shopling-company
          SHOPLING_API_AUTH_KEY: ci-shopling-key
