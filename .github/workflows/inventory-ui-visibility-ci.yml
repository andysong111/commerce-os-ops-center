name: Inventory UI Visibility CI
on:
  pull_request:
    paths:
      - 'src/components/china-order-manager/InventoryStockOperationalDetails.tsx'
      - 'src/components/china-order-manager/StockSyncOperationalQueuePanel.tsx'
      - 'src/lib/inventoryStockConnection.ts'
      - 'scripts/inventory-ui-hidden-check.mjs'
      - '.github/workflows/inventory-ui-visibility-ci.yml'
  push:
    branches: [fix/inventory-ui-owned-state-20260913]
    paths:
      - 'src/components/china-order-manager/InventoryStockOperationalDetails.tsx'
      - 'src/components/china-order-manager/StockSyncOperationalQueuePanel.tsx'
      - 'src/lib/inventoryStockConnection.ts'
      - 'scripts/inventory-ui-hidden-check.mjs'
      - '.github/workflows/inventory-ui-visibility-ci.yml'
permissions:
  contents: read
concurrency:
  group: inventory-ui-visibility-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Install isolated browser tools (do not resolve app dependencies again)
        run: |
          mkdir -p /tmp/inventory-ui-tools
          npm install --prefix /tmp/inventory-ui-tools --no-save playwright@1.55.1
          /tmp/inventory-ui-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start actual Next page with no production credentials
        run: |
          mkdir -p artifacts/inventory-ui-hidden
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3210 > artifacts/inventory-ui-hidden/next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3210/china-order-manager/stock-control > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Explicit result must render independently of passive visibility polling
        run: |
          cp scripts/inventory-ui-hidden-check.mjs /tmp/inventory-ui-tools/check.mjs
          node /tmp/inventory-ui-tools/check.mjs
        env:
          INVENTORY_UI_BASE_URL: http://127.0.0.1:3210
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-ui-visibility-evidence
          path: artifacts/inventory-ui-hidden
          retention-days: 3
