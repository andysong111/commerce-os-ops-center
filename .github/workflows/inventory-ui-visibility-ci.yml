name: Inventory UI Visibility CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/china-order-manager/InventoryStockOperationalDetails.tsx'
      - 'src/components/china-order-manager/StockSyncOperationalQueuePanel.tsx'
      - 'src/lib/inventoryStockConnection.ts'
      - 'scripts/inventory-ui-hidden-check.mjs'
      - 'scripts/shopling-idle-live-channel-check.mjs'
      - 'scripts/shopling-stock-batch-browser-check.mjs'
      - 'src/components/china-order-manager/InventoryStockoutOperatorPanel.tsx'
      - 'src/lib/shoplingStockBatchPreflight.ts'
      - 'public/shopling-stock-state-sync/**'
      - 'src/app/api/shopling-stock-state-sync/**'
      - 'src/components/china-order-manager/StockSyncHF15Bridge.tsx'
      - '.github/workflows/inventory-ui-visibility-ci.yml'
  push:
    branches: [fix/inventory-ui-owned-state-20260913]
    paths:
      - 'src/components/china-order-manager/InventoryStockOperationalDetails.tsx'
      - 'src/components/china-order-manager/StockSyncOperationalQueuePanel.tsx'
      - 'src/lib/inventoryStockConnection.ts'
      - 'scripts/inventory-ui-hidden-check.mjs'
      - '.github/workflows/inventory-ui-visibility-ci.yml'
permissions:
  contents: read
concurrency:
  group: inventory-ui-visibility-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Install isolated browser tools (do not resolve app dependencies again)
        run: |
          mkdir -p /tmp/inventory-ui-tools
          npm install --prefix /tmp/inventory-ui-tools --no-save playwright@1.55.1 fflate@0.8.2
          /tmp/inventory-ui-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start actual Next page with no production credentials
        run: |
          mkdir -p artifacts/inventory-ui-hidden
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3210 > artifacts/inventory-ui-hidden/next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3210/china-order-manager/stock-control > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Explicit result must render independently of passive visibility polling
        run: |
          cp scripts/inventory-ui-hidden-check.mjs /tmp/inventory-ui-tools/check.mjs
          node /tmp/inventory-ui-tools/check.mjs
        env:
          INVENTORY_UI_BASE_URL: http://127.0.0.1:3210
      - name: Check repeat B-code commands after success or failure, full input coverage and phased receipts
        run: |
          cp scripts/shopling-stock-batch-browser-check.mjs /tmp/inventory-ui-tools/batch-browser-check.mjs
          node /tmp/inventory-ui-tools/batch-browser-check.mjs
      - name: Rollback extension worker must return the explicit idle receipt
        run: |
          cp scripts/shopling-idle-live-channel-check.mjs /tmp/inventory-ui-tools/idle-channel-check.mjs
          xvfb-run -a node /tmp/inventory-ui-tools/idle-channel-check.mjs
        env:
          COMMERCE_OS_EXTENSION_URL: http://127.0.0.1:3210/api/shopling-stock-state-sync/download-hf101
          COMMERCE_OS_EXTENSION_VERSION: 0.6.61
      - name: Released option and product extension returns an explicit idle receipt in Chrome
        run: xvfb-run -a node /tmp/inventory-ui-tools/idle-channel-check.mjs
        env:
          COMMERCE_OS_EXTENSION_URL: http://127.0.0.1:3210/api/shopling-stock-state-sync/download-hf102
          COMMERCE_OS_EXTENSION_VERSION: 0.6.62
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-ui-visibility-evidence
          path: artifacts/inventory-ui-hidden
          retention-days: 3
