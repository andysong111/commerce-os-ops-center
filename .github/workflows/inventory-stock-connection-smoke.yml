name: Inventory Stock Connection Smoke
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/202609130004_inventory_tail_latest_snapshot_cache.sql'
      - 'src/lib/inventoryStockReadGuard.ts'
      - 'scripts/inventory-stock-connection-smoke.mjs'
      - '.github/workflows/inventory-stock-connection-smoke.yml'
  workflow_dispatch:
    inputs:
      refresh_evidence:
        description: 'Refresh existing Tail sales evidence once (no stock/status POST)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: inventory-stock-connection-smoke
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Allow production rollout to finish
        if: github.event_name == 'push'
        run: sleep 100
      - name: Verify canonical production inventory response
        env:
          REFRESH_EVIDENCE: ${{ github.event_name == 'push' || inputs.refresh_evidence }}
        run: node scripts/inventory-stock-connection-smoke.mjs
