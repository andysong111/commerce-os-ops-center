name: Shopling Market A18 Frame Start v0.3.40
on:
  pull_request:
    paths:
      - 'src/lib/shoplingMarketA18FrameStartV0340.ts'
      - 'src/app/api/shopling-market-group-canary/v0340/**'
      - 'tests/shoplingMarketA18FrameStartV0340.test.mjs'
      - '.github/workflows/shopling-market-a18-frame-v0340.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopling-a18-frame-v0340-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify v0.3.40 frame-start contracts
        run: node --experimental-strip-types --test tests/shoplingMarketA18FrameStartV0340.test.mjs tests/shoplingMarketReliableReadbackBulkV0339.test.mjs
      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Generate and inspect actual extension ZIP
        run: |
          npm run start -- --port 3100 > /tmp/shopling-v0340-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/shopling-market-group-canary/v0340/download -o /tmp/commerce-os-shopling-market-sender-v0.3.40.zip; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, pathlib, zipfile
          archive=pathlib.Path('/tmp/commerce-os-shopling-market-sender-v0.3.40.zip')
          assert archive.is_file() and archive.stat().st_size > 1000
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='0.3.40'
              popup=z.read('popup.js').decode()
              content=z.read('content-group-canary.mjs').decode()
              bg=z.read('background-root.mjs').decode()
              assert 'locateA18ProductFrame' in popup
              assert 'allFrames: true' in popup
              assert '{ frameId: frameId }' in popup
              assert 'chrome.tabs.reload(' not in popup
              assert 'window.top !== window' in content
              assert content.index('message.type === SELECTED_START_MESSAGE') < content.index('if (window.top !== window) return false;')
              assert '/api/shopling-market-group-canary/v0339/status' in bg
              assert 'DIRECT_RESULT_MAX_ATTEMPTS = 240' in bg
              z.extractall('/tmp/shopling-v0340')
          PY
          for file in /tmp/shopling-v0340/*.js /tmp/shopling-v0340/*.mjs; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: shopling-market-sender-v0340
          path: /tmp/commerce-os-shopling-market-sender-v0.3.40.zip
          retention-days: 7
