name: Fast Purchase Internal Draft CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Test internal draft safety
        run: >-
          node --experimental-strip-types --test
          tests/fastPurchaseInternalDraft.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/internalChinaInlineQuantity.test.mjs
          tests/internalChinaManualBulkAdd.test.mjs
      - name: Lint internal draft files
        run: >-
          npx eslint
          src/lib/fastPurchaseInternalDraft.ts
          src/lib/monthlyPurchasePolicy.ts
          src/lib/monthlyPurchaseCycleGate.ts
          src/lib/purchaseDraftQuantityRounding.ts
          src/app/api/fast-purchase/drafts/route.ts
          src/components/fast-purchase-mvp/FastPurchaseDraftActions.tsx
          src/app/fast-purchase-mvp/page.tsx
          src/components/china-order-manager/InternalChinaPurchaseDraftWorkspaceV2.tsx
          src/components/china-order-manager/InternalChinaManualDraftLineAdder.tsx
          src/app/china-order-manager/drafts/[draftId]/page.tsx
          tests/fastPurchaseInternalDraft.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/internalChinaInlineQuantity.test.mjs
          tests/internalChinaManualBulkAdd.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fast-purchase-draft-build.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fast_purchase_draft_build
          SUPABASE_SECRET_KEY: sb_secret_fast_purchase_draft_build
