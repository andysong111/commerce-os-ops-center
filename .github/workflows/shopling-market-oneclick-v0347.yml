name: Shopling Market One Click v0.3.47
on:
  pull_request:
    paths:
      - 'src/lib/shoplingMarketA19LoginLoopV0347.ts'
      - 'src/lib/shoplingMarketA19KeywordAuditV0346.ts'
      - 'src/app/api/shopling-market-group-canary/v0347/**'
      - 'src/app/seo-bulk-cloud/SeoBulkShoplingOneClickControl.tsx'
      - 'tests/shoplingMarketA19LoginLoopV0347.test.mjs'
      - 'tests/shoplingMarketA19KeywordAuditV0346.test.mjs'
      - 'tests/shoplingMarketAdminHostV0345.test.mjs'
      - 'docs/handoffs/seo-one-click-market-auto-reconnect-20261113.md'
      - 'docs/commerce-os-master-context-20260929.md'
      - '.github/workflows/shopling-market-oneclick-v0347.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopling-oneclick-v0347-${{ github.ref }}
  cancel-in-progress: true
jobs:
  login-loop-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify A19 login-loop containment and inherited audit safety
        run: node --experimental-strip-types --test tests/shoplingMarketA19LoginLoopV0347.test.mjs tests/shoplingMarketA19KeywordAuditV0346.test.mjs tests/shoplingMarketAdminHostV0345.test.mjs tests/shoplingMarketBridgeManifestV0344.test.mjs tests/shoplingMarketOneClickBackgroundV0343.test.mjs tests/shoplingMarketGroupCanaryV0330.test.mjs tests/shoplingMarketGroupCanary.test.mjs
      - run: npm run typecheck
      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Generate and inspect actual v0.3.47 extension ZIP
        run: |
          npm run start -- --port 3100 > /tmp/shopling-v0347-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/shopling-market-group-canary/v0347/download -o /tmp/commerce-os-shopling-market-sender-v0.3.47.zip; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, pathlib, zipfile
          archive=pathlib.Path('/tmp/commerce-os-shopling-market-sender-v0.3.47.zip')
          assert archive.is_file() and archive.stat().st_size > 1000
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='0.3.47'
              agents=[entry for entry in manifest.get('content_scripts', []) if 'shopling-market-auto-agent.mjs' in entry.get('js', [])]
              assert agents==[{
                  'matches':['https://a.shopling.co.kr/*','https://kt.shopling.co.kr/*'],
                  'js':['shopling-market-auto-agent.mjs'],
                  'all_frames':False,
                  'run_at':'document_idle',
              }]
              agent=z.read('shopling-market-auto-agent.mjs').decode()
              background=z.read('background-root.mjs').decode()
              auditor=z.read('shopling-a19-keyword-auditor.mjs').decode()
              assert '/login.phtml' in agent
              assert '/prodlinkage/goods_mallReg_failList.phtml' in agent
              assert 'marketAutoA19AuditInFlight' in background
              assert 'a19_login_required' in background
              assert 'a19AuditReceipt' in background
              assert '상품 재전송' not in auditor
              z.extractall('/tmp/shopling-v0347')
          PY
          for file in /tmp/shopling-v0347/*.js /tmp/shopling-v0347/*.mjs; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: shopling-market-sender-v0347
          path: /tmp/commerce-os-shopling-market-sender-v0.3.47.zip
          retention-days: 7
