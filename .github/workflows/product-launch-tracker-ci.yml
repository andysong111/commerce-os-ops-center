name: Product Launch Tracker CI

on:
  pull_request:
    paths:
      - 'public/product-launch-tracker-app/**'
      - 'src/app/api/product-launch-tracker/**'
      - 'src/app/api/seo-run-*/**'
      - 'src/app/seo-bulk-cloud/**'
      - 'src/app/seo-title-cloud-shopling-runner/**'
      - 'src/app/detail-page-ai-review/**'
      - 'src/app/api/shopling-categories/**'
      - 'src/app/shopling-category-review-queue/**'
      - 'src/components/AppShell.tsx'
      - 'src/components/OpsCategoryUpdateCancelControl.tsx'
      - 'src/components/OpsLocalCategoryStatusBridge.tsx'
      - 'src/components/OpsWorkAssistant.tsx'
      - 'src/components/detail-page-ai-review/**'
      - 'src/components/shopling-category-review/**'
      - 'src/lib/detailPageManualDecision.ts'
      - 'src/lib/extendedModuleRegistry.ts'
      - 'src/lib/opsWorkspace.ts'
      - 'src/lib/productLaunchTracker*.ts'
      - 'src/lib/productLaunchStock*.ts'
      - 'src/lib/productLaunchShopling*.ts'
      - 'src/lib/seoRun*.ts'
      - 'src/lib/productLaunchOptionBarcodeRegistry.ts'
      - 'src/lib/keywordEngineElonBulkFinal*.ts'
      - 'src/lib/keywordEngineElonKeywordPortfolioV8.ts'
      - 'src/lib/keywordEngineElonKeywordPortfolioV8SparseGuardV10.ts'
      - 'src/lib/keywordEngineElonFreshMallTitleComposer*.ts'
      - 'src/lib/keywordEngineElonMallTitleIntentPortfolioV7.ts'
      - 'src/lib/keywordEngineElonSourceIdentityGuardV9.ts'
      - 'src/lib/keywordEngineElonIdentityConsistencyV10.ts'
      - 'src/lib/keywordEngineElonLabV2ServerGuardedV9.ts'
      - 'src/lib/keywordEngineElonLabV2Step4GuardedV10.ts'
      - 'src/lib/shoplingCategory*.ts'
      - 'src/lib/openAiStructuredOutput.ts'
      - 'supabase/migrations/*product_launch*.sql'
      - 'supabase/migrations/*option_barcode*.sql'
      - 'supabase/migrations/*seo_run_shopling*.sql'
      - 'tests/productLaunchTracker*.test.mjs'
      - 'tests/productLaunchStock*.test.mjs'
      - 'tests/productLaunchShopling*.test.mjs'
      - 'tests/productLaunchSeoRun*.test.mjs'
      - 'tests/productLaunchOptionBarcodeRegistry.test.mjs'
      - 'tests/seoTitleIntentPortfolioV7.test.mjs'
      - 'tests/seoKeywordTitleSearchComplementV8.test.mjs'
      - 'tests/seoIdentityAndSparseTitleV9.test.mjs'
      - 'tests/seoSemanticConsistencyV10.test.mjs'
      - 'tests/seoGroundedReservoirV11.test.mjs'
      - 'tests/detailPageAssetStorageRetry.test.mjs'
      - 'tests/detailPageManualDecision.test.mjs'
      - 'tests/shoplingCategory*.test.mjs'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/product-launch-tracker-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run product launch tracker tests
        run: >-
          npx tsx --test
          tests/productLaunchTrackerEntry.test.mjs
          tests/productLaunchTrackerControlPlaneV2.test.mjs
          tests/productLaunchTrackerSorting.test.mjs
          tests/productLaunchTrackerShopling.test.mjs
          tests/productLaunchTrackerShoplingPriceRounding.test.mjs
          tests/productLaunchStockAvailability.test.mjs
          tests/productLaunchShoplingHistoricalOptionRecovery.test.mjs
          tests/productLaunchShoplingRetry.test.mjs
          tests/productLaunchShoplingReadback.test.mjs
          tests/productLaunchShoplingPostprocessWorker.test.mjs
          tests/productLaunchShoplingRegistrationTruth.test.mjs
          tests/productLaunchShoplingServerQueue.test.mjs
          tests/productLaunchShoplingWorkerSplit.test.mjs
          tests/productLaunchSeoRunStorageResilience.test.mjs
          tests/productLaunchOptionBarcodeRegistry.test.mjs
          tests/productLaunchShoplingMallSeo.test.mjs
          tests/productLaunchTrackerUploadClaim.test.mjs
          tests/productLaunchTrackerCategoryCancel.test.mjs
          tests/productLaunchTrackerSingleRowAdd.test.mjs
          tests/productLaunchTrackerTableOps.test.mjs
          tests/productLaunchTrackerChinaProductLinks.test.mjs
          tests/productLaunchTrackerChinaLinkHealth.test.mjs
          tests/productLaunchTrackerChinaOrderMappingActiveUi.test.mjs
          tests/productLaunchTrackerModelBcodeAuthority.test.mjs
          tests/productLaunchTrackerManualPriceSave.test.mjs
          tests/productLaunchTrackerBatchSelection.test.mjs
          tests/productLaunchTrackerNormalizedCutover.test.mjs
          tests/seoTitleIntentPortfolioV7.test.mjs
          tests/seoKeywordTitleSearchComplementV8.test.mjs
          tests/seoIdentityAndSparseTitleV9.test.mjs
          tests/seoSemanticConsistencyV10.test.mjs
          tests/seoGroundedReservoirV11.test.mjs
          tests/detailPageAssetStorageRetry.test.mjs
          tests/detailPageManualDecision.test.mjs
          tests/shoplingCategoryCatalog.test.mjs
          tests/shoplingCategoryRunStatus.test.mjs
          tests/shoplingCategoryLocalUpdate.test.mjs
          tests/shoplingCategorySupabaseStore.test.mjs
          tests/shoplingCategoryReviewQueue.test.mjs
          tests/shoplingCategoryAiDelivery.test.mjs
          tests/shoplingCategoryCandidateChoices.test.mjs
          tests/shoplingCategoryCoreNounReview.test.mjs
          tests/shoplingCategoryJsonRecovery.test.mjs
