name: Agent Reuse Blocked Evidence

on:
  push:
    branches:
      - agent/reuse-blocked-evidence-run-20260805-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[evidence-reuse-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-blocked-evidence-run-20260805-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/agent-reuse-blocked-evidence-run.mjs
      - run: node --check public/product-launch-tracker-app/detail-page-dock.js
      - run: npx tsx --test tests/productLaunchTrackerDetailPageDock.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-launch-tracker-app/detail-page-dock.js tests/productLaunchTrackerDetailPageDock.test.mjs
          git commit -m "Reuse persisted 1688 evidence runs [evidence-reuse-patched]"
          git push origin HEAD:agent/reuse-blocked-evidence-run-20260805-v2
