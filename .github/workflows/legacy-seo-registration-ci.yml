name: Legacy SEO Registration CI

on:
  pull_request:
    paths:
      - '.github/workflows/legacy-seo-registration-ci.yml'
      - 'src/lib/legacySeoRegistrationPolicy.ts'
      - 'src/lib/legacySeoInventoryCatalog.ts'
      - 'src/lib/legacySeoStockRecovery.ts'
      - 'src/lib/legacySeoShoplingEvidence.ts'
      - 'src/lib/legacySeoShoplingOptionSync.ts'
      - 'src/lib/legacySeoShoplingAssetRecovery.ts'
      - 'src/lib/legacySeoShoplingSyncState.ts'
      - 'src/lib/legacySeoCanonicalPrice.ts'
      - 'src/lib/legacySeoDuplicateModelGuard.ts'
      - 'src/lib/legacySeoPreflight.ts'
      - 'src/lib/legacySeoShoplingPayload.ts'
      - 'src/lib/legacySeoShoplingPriceMath.ts'
      - 'src/lib/legacySeoShoplingPriceRecovery.ts'
      - 'src/lib/legacySeoShoplingRegistration.ts'
      - 'src/app/api/cron/legacy-shopling-image-repair/route.ts'
      - 'src/app/api/legacy-seo-source-recovery/route.ts'
      - 'src/app/api/legacy-seo-preflight/route.ts'
      - 'src/app/api/legacy-seo-run-jobs/route.ts'
      - 'src/app/api/legacy-seo-run-jobs-lite/route.ts'
      - 'src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx'
      - 'src/app/legacy-seo-bulk-cloud/LegacySeoSourceRecoveryEnhancer.tsx'
      - 'src/app/legacy-seo-bulk-cloud/LegacySeoBulkListFetchShim.tsx'
      - 'src/app/legacy-seo-bulk-cloud/LegacySeoBulkRunAllEnhancer.tsx'
      - 'src/app/legacy-seo-bulk-cloud/page.tsx'
      - 'tests/legacySeoRegistrationPolicy.test.mjs'
      - 'tests/legacySeoShoplingOptionSyncSafety.test.mjs'
      - 'tests/legacySeoShoplingSyncState.test.mjs'
      - 'tests/legacySeoShoplingEvidenceStaleFallback.test.mjs'
      - 'tests/legacySeoBulkRunAll.test.mjs'
      - 'tests/legacySeoBulkLoading.test.mjs'
      - 'tests/legacySeoListFailure.test.mjs'
      - 'tests/legacySeoStockRecovery.test.mjs'
      - 'tests/legacySeoShoplingPayload.test.mjs'
      - 'tests/legacySeoShoplingPriceRecovery.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Test legacy SEO registration safety
        run: >-
          node --experimental-strip-types --test
          tests/legacySeoRegistrationPolicy.test.mjs
          tests/legacySeoShoplingOptionSyncSafety.test.mjs
          tests/legacySeoShoplingSyncState.test.mjs
          tests/legacySeoShoplingEvidenceStaleFallback.test.mjs
          tests/legacySeoBulkRunAll.test.mjs
          tests/legacySeoBulkLoading.test.mjs
          tests/legacySeoListFailure.test.mjs
          tests/legacySeoStockRecovery.test.mjs
          tests/legacySeoShoplingPayload.test.mjs
          tests/legacySeoShoplingPriceRecovery.test.mjs
