name: Publish verified monthly price working patch
on:
  push:
    branches: [agent/monthly-price-one-click-20260921]
    paths: ['.github/monthly-price-publish/**', '.github/workflows/monthly-price-publish-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'andysong111/commerce-os-ops-center' && github.ref == 'refs/heads/agent/monthly-price-one-click-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-verified source-only patch on isolated branch
        run: |
          python - <<'PY'
          import pathlib,lzma,hashlib,subprocess
          parts=[pathlib.Path(f'.github/monthly-price-publish/part{i}.xz').read_bytes() for i in range(4)]
          patch=lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()=='ad738e3acb88caef20ab02d15dfc127738a5c8ddf8601a9eadeaa34bf65b78cd'
          assert b'diff --git a/.github/workflows/' not in patch
          pathlib.Path('/tmp/monthly-price.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/monthly-price.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/monthly-price.patch'],check=True)
          PY
          git diff --cached --check
          git config user.name "andysong111"
          git config user.email "220983550+andysong111@users.noreply.github.com"
          git commit -m "feat: conservative receipt-month one-click Shopling price workflow"
          git push origin HEAD:refs/heads/agent/monthly-price-one-click-20260921
