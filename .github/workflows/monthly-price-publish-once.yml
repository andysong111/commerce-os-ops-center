name: Publish verified monthly price validation fixes
on:
  push:
    branches: [agent/monthly-price-one-click-20260921]
    paths: ['.github/monthly-price-publish/**', '.github/workflows/monthly-price-publish-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'andysong111/commerce-os-ops-center' && github.ref == 'refs/heads/agent/monthly-price-one-click-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-verified source-only validation patch
        run: |
          python - <<'PY'
          import pathlib,lzma,hashlib,subprocess
          patch=lzma.decompress(pathlib.Path('.github/monthly-price-publish/fix.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='c0346733e872d143349b6445a530870662971f020d25a825f21e81c0230f4adc'
          assert b'diff --git a/.github/workflows/' not in patch
          pathlib.Path('/tmp/monthly-price-fix.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/monthly-price-fix.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/monthly-price-fix.patch'],check=True)
          PY
          git diff --cached --check
          git config user.name "andysong111"
          git config user.email "220983550+andysong111@users.noreply.github.com"
          git commit -m "fix: repository REST contracts and immutable source revision recovery"
          git push origin HEAD:refs/heads/agent/monthly-price-one-click-20260921
