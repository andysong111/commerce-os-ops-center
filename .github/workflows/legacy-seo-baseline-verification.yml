name: Legacy SEO Baseline Verification
on:
  push:
    branches: ['fix/legacy-seo-recovery-20260914']
    paths: ['.github/workflows/legacy-seo-baseline-verification.yml']
permissions:
  contents: read
jobs:
  compare-existing-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Read baseline worktree without modifying either revision
        run: |
          git fetch --quiet --depth=1 origin ad6ec96eb48142f2c990f9d53e0d7688faf396b7
          git worktree add --detach /tmp/seo-baseline ad6ec96eb48142f2c990f9d53e0d7688faf396b7
          cmp package-lock.json /tmp/seo-baseline/package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/seo-baseline/node_modules
      - name: Execute identical real regression suites at both revisions
        shell: bash
        run: |
          mkdir -p artifacts/seo-baseline
          python3 - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          tests = ['seoTitleInventoryLedger','seoTitleFinalKeywordInventoryGenerator','seoTitleV4MinLengthContract','keywordEngineElonLabSeoOutput','keywordEngineElonMallTitleSafeComposer','seoCategoryIntentExpansionV5','seoBulkMallTitleFactBridge','seoBulkCloudParallel','seoBulkLongTitleV6UpgradeBridge','seoRunDurableWorker','seoRunClaimLoadShedding','seoCloudPerformance']
          root = Path(os.environ['GITHUB_WORKSPACE'])
          out = root/'artifacts/seo-baseline'
          reports = {}
          for label, cwd in [('baseline', Path('/tmp/seo-baseline')), ('head', root)]:
              run = subprocess.run(['node','--experimental-strip-types','--test','--test-reporter=junit',*[f'tests/{name}.test.mjs' for name in tests]], cwd=cwd, capture_output=True, text=True, timeout=180)
              (out/f'{label}.xml').write_text(run.stdout)
              (out/f'{label}.stderr').write_text(run.stderr)
              tree = ET.fromstring(run.stdout)
              cases = list(tree.iter('testcase'))
              failed = [{'name':c.get('name'), 'message':(c.find('failure').get('message') or '')[:500]} for c in cases if c.find('failure') is not None]
              reports[label] = {'returncode':run.returncode,'tests':len(cases),'failures':failed}
          reports['same_failure_names'] = sorted(f['name'] for f in reports['baseline']['failures']) == sorted(f['name'] for f in reports['head']['failures'])
          (out/'comparison.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          assert reports['baseline']['tests'] > 0
          assert reports['baseline']['tests'] == reports['head']['tests']
          assert reports['same_failure_names'], 'The recovery head introduced a new baseline difference'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-exact-baseline-comparison
          path: artifacts/seo-baseline
          retention-days: 7
