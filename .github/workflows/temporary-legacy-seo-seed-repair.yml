    paths: ['.github/workflows/temporary-legacy-seo-seed-repair.yml']
permissions:
  contents: write
concurrency:
  group: prepare-legacy-seo-seed-recovery-20260912
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply narrow source patch and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = '8e4ae2c82a8de28433888db14ceba5623c417126'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == expected, 'Unexpected patch base'
          def write(path, content):
              p = Path(path)
              assert not p.exists(), 'Unexpected existing new file: ' + path
              p.write_text(content.lstrip('\n'), encoding='utf-8')
          def replace(path, old, new):
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              assert value.count(old) == 1, 'Patch context changed: ' + path
              p.write_text(value.replace(old,new,1), encoding='utf-8')
          write('src/lib/keywordEngineElonSelectionRecovery.ts', r'''
          import type {
            KeywordElonCandidate,
            KeywordElonDiscovery,
            KeywordElonIdentity,
          } from "@/lib/keywordEngineElonLabV2";

          // Recall is not approval. Restored terms still pass the unchanged semantic,
          // category, demand/accuracy and prohibited-keyword gates.
          export const KEYWORD_ELON_RECOVERY_VERSION = "identity-first-bounded-v1";
          export const KEYWORD_ELON_RECOVERY_LIMIT = 48;
          export const KEYWORD_ELON_RECOVERY_MAX_ATTEMPTS = 2;
          type RecoveryMarker = { version?: unknown; attempts?: unknown };

          function key(value: unknown) {
            return String(value ?? "").normalize("NFKC")
              .replace(/[^0-9A-Za-z가-힣]/g, "").toLocaleLowerCase();
          }
          function unique(values: unknown[], limit: number) {
            const seen = new Set<string>();
            const result: string[] = [];
            for (const value of values) {
              const normalized = key(value);
              if (!normalized || seen.has(normalized)) continue;
              seen.add(normalized);
              result.push(normalized);
              if (result.length >= limit) break;
            }
            return result;
          }
          function identitySeeds(identity: KeywordElonIdentity) {
            return unique([identity.coreProduct, ...(identity.primarySeeds ?? []), identity.identityAnchor], 16);
          }
          export function prioritizeKeywordElonCandidatePool(identity: KeywordElonIdentity, candidates: string[]) {
            // Same 500-candidate ceiling; identity cannot be displaced by depth-2 demand.
            return unique([...identitySeeds(identity), ...candidates], 500);
          }
          export function keywordElonScoreUnavailable(candidate: KeywordElonCandidate) {
            return /^(AI 점수화 실패|AI 점수 응답 누락)/.test(candidate.rationale ?? "");
          }
          export function planKeywordElonSelectionRecovery(input: {
            identity: KeywordElonIdentity;
            discovery: KeywordElonDiscovery;
            candidates: KeywordElonCandidate[];
            previous?: RecoveryMarker | null;
          }) {
            const previousAttempts = input.previous?.version === KEYWORD_ELON_RECOVERY_VERSION
              ? Number(input.previous.attempts ?? 0) : 0;
            if (!Number.isSafeInteger(previousAttempts) || previousAttempts < 0
              || previousAttempts >= KEYWORD_ELON_RECOVERY_MAX_ATTEMPTS) return null;
            const existing = new Map(input.candidates.map((row) => [
              key(row.searchKeyword || row.searchKey || row.keyword), row,
            ]));
            const seeds = identitySeeds(input.identity);
            const seedKeys = new Set(seeds);
            const core = key(input.identity.coreProduct);
            const tagged = Object.entries(input.discovery.sourceTagsByKeyword ?? {})
              .filter(([, tags]) => tags.some((tag) => [
                "primary_seed", "market_bridge_seed", "api_hub_evidence_term", "ai_recall_support",
              ].includes(tag)))
              .map(([term]) => term);
            const stats = input.discovery.searchAdStats ?? [];
            const anchoredStats = stats.filter((row) => core.length >= 2 && key(row.keyword).includes(core));
            const directStats = stats.filter((row) => (row.sourceSeeds ?? []).some((seed) => seedKeys.has(key(seed))));
            const pool = unique([
              ...seeds, ...tagged,
              ...(input.discovery.marketTerms ?? []), ...(input.discovery.marketBridgeSeeds ?? []),
              ...anchoredStats.map((row) => row.keyword), ...directStats.map((row) => row.keyword),
              ...input.discovery.candidates,
            ], 10_000);
            // Never re-score a real semantic rejection until it happens to pass.
            // Only omitted terms and failed/missing scoring responses are recoverable.
            const keywords = pool.filter((term) => {
              const row = existing.get(term);
              return !row || keywordElonScoreUnavailable(row);
            }).slice(0, KEYWORD_ELON_RECOVERY_LIMIT);
            if (!keywords.length) return null;
            return {
              version: KEYWORD_ELON_RECOVERY_VERSION,
              attempts: previousAttempts + 1,
              keywords,
              originalCandidateCount: input.candidates.length,
              unavailableScoreCount: input.candidates.filter(keywordElonScoreUnavailable).length,
              missingIdentitySeedCount: seeds.filter((seed) => !existing.has(seed)).length,
            };
          }
          ''')
          worker = 'src/lib/legacySeoRunWorker.ts'
          replace(worker, 'import { scoreKeywordElonCandidatesBatched } from "@/lib/keywordEngineElonLabV2Scoring";', '''import { scoreKeywordElonCandidatesBatched } from "@/lib/keywordEngineElonLabV2Scoring";
          import {
            prioritizeKeywordElonCandidatePool,
            planKeywordElonSelectionRecovery,
          } from "@/lib/keywordEngineElonSelectionRecovery";''')
          replace(worker, '''  if (job.stage === "score_keywords") {
              const scored = await scoreKeywordElonCandidatesBatched({''', '''  if (job.stage === "score_keywords") {
              const scoringDiscovery = {
                ...discovery,
                candidates: prioritizeKeywordElonCandidatePool(identity, discovery.candidates),
              };
              const scored = await scoreKeywordElonCandidatesBatched({''')
          replace(worker, '''      discovery,
                shoplingCategory: text(input.mallTitleCategory),''', '''      discovery: scoringDiscovery,
                shoplingCategory: text(input.mallTitleCategory),''')
          replace(worker, '''        candidates: scored.candidates,
                  expansionRound: 1,''', '''        discovery: scoringDiscovery,
                  candidates: scored.candidates,
                  scoringDiagnostics: {
                    chunks: scored.scoringChunkCount,
                    successfulChunks: scored.scoringSuccessfulChunks,
                    warnings: scored.scoringWarnings,
                  },
                  expansionRound: 1,''')
          replace(worker, '''    if (!finalCandidates.length) {
                throw new Error("STEP 4에 전달할 월검색량/정확성 통과 후보가 없습니다.");
              }''', '''    if (!finalCandidates.length) {
                const recovery = planKeywordElonSelectionRecovery({
                  identity,
                  discovery,
                  candidates,
                  previous: record(state.selectionRecovery),
                });
                if (recovery) {
                  // Reserve the paid attempt before external work. Crashes and API errors
                  // cannot reset the recovery budget or cause repeated full discovery.
                  await checkpoint(config, job, workerId, {
                    message: `누락/미평가 핵심 후보 ${recovery.keywords.length}개 복구 점수화 · ${recovery.attempts}/2`,
                    checkpoint_payload: {
                      ...state,
                      selectionRecovery: { ...recovery, status: "scoring", startedAt: new Date().toISOString() },
                    },
                  });
                  const scored = await scoreKeywordElonCandidatesBatched({
                    source,
                    identity,
                    discovery: { ...discovery, candidates: recovery.keywords },
                    shoplingCategory: text(input.mallTitleCategory),
                  });
                  const recoveredCandidates = mergeKeywordElonCandidates(candidates, scored.candidates);
                  // Yield after persisting results. The next invocation must use the
                  // unchanged union AND prohibited filter before any title is generated.
                  return patchClaimedLegacySeoRunJob(config, job.run_id, workerId, {
                    status: "queued",
                    stage: "filter_keywords",
                    stage_index: 5,
                    progress_percent: 70,
                    message: "핵심 후보 복구 점수화 저장 완료 · 동일 기준/금지어 재검사 대기",
                    checkpoint_payload: {
                      ...state,
                      candidates: recoveredCandidates,
                      selectionRecovery: {
                        ...recovery,
                        status: "scored",
                        successfulChunks: scored.scoringSuccessfulChunks,
                        scoringWarnings: scored.scoringWarnings,
                        completedAt: new Date().toISOString(),
                      },
                    },
                    error_message: "",
                    not_before: new Date().toISOString(),
                    lease_owner: null,
                    lease_until: null,
                  });
                }
                const attempts = Number(record(state.selectionRecovery).attempts) || 0;
                throw new Error(`STEP 4에 전달할 월검색량/정확성 통과 후보가 없습니다. · 제한 복구 ${attempts}회 이후 기준 미충족/미평가 상태 보존`);
              }''')
          discovery_path = 'src/lib/keywordEngineElonLabV2Discovery.ts'
          replace(discovery_path, 'const seeds = uniqueKeywordElonCanonical([...identity.primarySeeds, ...identity.conditionalSeeds], 8);', 'const seeds = uniqueKeywordElonCanonical([identity.coreProduct, ...identity.primarySeeds, identity.identityAnchor, ...identity.conditionalSeeds], 8);')
          replace(discovery_path, '''  const searchAdSeeds = uniqueKeywordElonCanonical([
              ...market.marketTerms,''', '''  const searchAdSeeds = uniqueKeywordElonCanonical([
              ...seeds,
              ...market.marketTerms,''')
          replace(discovery_path, '''  const candidates = uniqueKeywordElonCanonical([
              ...market.marketTerms,
              ...relatedKeywords,
              ...market.bridgeSeeds,
              ...ai.keywords,
              ...seeds,
            ], 500);''', '''  const candidates = uniqueKeywordElonCanonical([
              ...seeds,
              ...market.bridgeSeeds,
              ...market.marketTerms,
              ...ai.keywords,
              ...relatedKeywords,
            ], 500);''')
          scoring_path = 'src/lib/keywordEngineElonLabV2Scoring.ts'
          replace(scoring_path, '''        store: false,
                  max_output_tokens: 3_000,''', r'''        store: false,
                  // Bound GPT-5 reasoning latency for small structured scoring batches.
                  // Unknown/custom models keep their existing request parameters.
                  ...(/^gpt-5(?:-(?:mini|nano))?(?:-\d{4}-\d{2}-\d{2})?$/.test(model)
                    ? { reasoning: { effort: "low" } }
                    : {}),
                  max_output_tokens: 3_000,''')
          write('tests/keywordEngineElonSelectionRecovery.test.mjs', r'''
          import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";
          import { stripTypeScriptTypes } from "node:module";
          import {
            prioritizeKeywordElonCandidatePool,
            planKeywordElonSelectionRecovery,
            keywordElonScoreUnavailable,
            KEYWORD_ELON_RECOVERY_VERSION,
          } from "../src/lib/keywordEngineElonSelectionRecovery.ts";
          const identity = {coreProduct:"패딩장갑", primarySeeds:["남성 방수 패딩장갑","패딩 장갑"], identityAnchor:"남성용 패딩장갑"};
          const broad = Array.from({length:600}, (_,i) => `unrelated${i}`);
          const discovery = {candidates:broad.slice(0,500),sourceTagsByKeyword:{},searchAdStats:[]};
          const row = (keyword, rationale="관련성 10 · 카테고리 0") => ({keyword,searchKey:keyword,rationale,safetyPass:false,titleEligible:false,relevance:10,qualityScore:0});
          test("500 cap reserves identity before broad demand", () => {
            const result=prioritizeKeywordElonCandidatePool(identity,broad);
            assert.equal(result.length,500);
            assert.deepEqual(result.slice(0,3),["패딩장갑","남성방수패딩장갑","남성용패딩장갑"]);
            assert.equal(new Set(result).size,result.length);
          });
          test("canonical normalization deduplicates seeds", () => {
            assert.deepEqual(prioritizeKeywordElonCandidatePool({coreProduct:"Ａ B",primarySeeds:["a-b",""],identityAnchor:"ab"},["A B","other"]),["ab","other"]);
          });
          test("omitted seeds recalled without inventing scores or demand", () => {
            const before=JSON.stringify(discovery);
            const plan=planKeywordElonSelectionRecovery({identity,discovery,candidates:broad.slice(0,500).map(term=>row(term))});
            assert.deepEqual(plan.keywords,["패딩장갑","남성방수패딩장갑","남성용패딩장갑"]);
            assert.equal(plan.missingIdentitySeedCount,3);
            assert.equal(JSON.stringify(discovery),before);
          });
          test("partial scoring failure differs from valid zero score", () => {
            assert.equal(keywordElonScoreUnavailable(row("a","AI 점수화 실패 · AI_SCORE_TIMEOUT")),true);
            assert.equal(keywordElonScoreUnavailable(row("a","AI 점수 응답 누락 · 안전Gate 탈락")),true);
            assert.equal(keywordElonScoreUnavailable(row("a")),false);
          });
          test("semantic rejections are not re-scored for a lucky pass", () => {
            const terms=prioritizeKeywordElonCandidatePool(identity,[]);
            assert.equal(planKeywordElonSelectionRecovery({identity,discovery:{...discovery,candidates:terms},candidates:terms.map(term=>row(term))}),null);
          });
          test("48 term ceiling and two durable attempts", () => {
            const candidates=broad.slice(0,500).map(term=>row(term,"AI 점수화 실패 · AI_SCORE_TIMEOUT"));
            const first=planKeywordElonSelectionRecovery({identity,discovery,candidates});
            assert.equal(first.keywords.length,48);
            assert.equal(first.unavailableScoreCount,500);
            const second=planKeywordElonSelectionRecovery({identity,discovery,candidates,previous:first});
            assert.equal(second.attempts,2);
            assert.equal(planKeywordElonSelectionRecovery({identity,discovery,candidates,previous:second}),null);
          });
          test("corrupt counters fail closed", () => {
            for(const attempts of [-1,NaN,Infinity,0.5,"bad"])
              assert.equal(planKeywordElonSelectionRecovery({identity,discovery,candidates:[],previous:{version:KEYWORD_ELON_RECOVERY_VERSION,attempts}}),null);
          });
          test("stored core and direct-seed evidence outrank unrelated depth2", () => {
            const plan=planKeywordElonSelectionRecovery({identity,candidates:[],discovery:{...discovery,searchAdStats:[{keyword:"바이크패딩장갑",sourceSeeds:[]},{keyword:"방한장갑",sourceSeeds:["패딩 장갑"]}]}});
            assert(plan.keywords.indexOf("바이크패딩장갑")<plan.keywords.indexOf("unrelated0"));
            assert(plan.keywords.indexOf("방한장갑")<plan.keywords.indexOf("unrelated0"));
          });
          test("successfully evaluated terms are not paid for again", () => {
            const candidates=prioritizeKeywordElonCandidatePool(identity,[]).map(term=>row(term));
            assert.equal(planKeywordElonSelectionRecovery({identity,discovery:{...discovery,candidates:[]},candidates,previous:{version:KEYWORD_ELON_RECOVERY_VERSION,attempts:1}}),null);
          });
          async function harness({throwScore=false}={}) {
            let persisted={run_id:"test-run",stage:"filter_keywords",status:"running",input_payload:{launchItemId:"item",sourceUrl:"shopling://legacy/1",customBlockedTerms:["교정","발열"]},checkpoint_payload:{source:{},identity,discovery,candidates:[]}};
            const calls={score:0,filter:0,patch:0};
            const globalsKey=`__legacyRecovery_${Math.random().toString(36).slice(2)}`;
            globalThis[globalsKey]={
              prioritizeKeywordElonCandidatePool,planKeywordElonSelectionRecovery,
              normalizeKeywordElonSelectionThresholds:()=>({demandQuality:65,accuracyRelevance:90}),
              selectKeywordElonStep4Union:(rows)=>rows.filter(r=>r.safetyPass&&r.titleEligible&&r.relevance>=90),
              compactKeywordElonKey:v=>String(v).replace(/[^0-9A-Za-z가-힣]/g,"").toLowerCase(),
              mergeKeywordElonCandidates:(base,added)=>[...base,...added],
              patchClaimedLegacySeoRunJob:async (_config,id,_worker,patch)=>{assert.equal(id,"test-run");calls.patch++;persisted={...persisted,...patch};return persisted;},
              scoreKeywordElonCandidatesBatched:async input=>{
                calls.score++;
                assert.equal(persisted.checkpoint_payload.selectionRecovery.status,"scoring");
                assert(persisted.checkpoint_payload.selectionRecovery.attempts>0);
                assert(input.discovery.candidates.length<=48);
                if(throwScore)throw Error("AI_SCORE_TIMEOUT");
                return {candidates:[{...row("패딩장갑"),safetyPass:true,titleEligible:true,relevance:95}],scoringSuccessfulChunks:1,scoringWarnings:[]};
              },
              filterKeywordElonProhibitedKeywords:async input=>{calls.filter++;assert.deepEqual(input.customBlockedTerms,["교정","발열"]);return {allowedKeys:["패딩장갑"],decisions:[]};},
            };
            const path=new URL("../src/lib/legacySeoRunWorker.ts",import.meta.url);
            const original=await readFile(path,"utf8");
            const strippedImports=original.replace(/import[\s\S]*?from\s+["'][^"']+["'];\n/g,"");
            const injected=`const {${Object.keys(globalThis[globalsKey]).join(",")}}=globalThis[${JSON.stringify(globalsKey)}];\n`;
            const js=stripTypeScriptTypes(injected+strippedImports+"\nexport {executeStage};",{mode:"strip"});
            const module=await import(`data:text/javascript;base64,${Buffer.from(js).toString("base64")}`);
            return {calls,get:()=>persisted,run:()=>module.executeStage({},persisted,"test-worker"),set:value=>{persisted={...persisted,...value};},cleanup:()=>delete globalThis[globalsKey]};
          }
          test("worker reserves attempt before score and yields without title/filter bypass", async()=>{
            const h=await harness();
            try {
              const recovered=await h.run();
              assert.equal(recovered.status,"queued");assert.equal(recovered.stage,"filter_keywords");
              assert.equal(recovered.lease_owner,null);assert.equal(recovered.lease_until,null);
              assert.equal(h.calls.score,1);assert.equal(h.calls.filter,0);
              h.set({status:"running"});
              const filtered=await h.run();
              assert.equal(filtered.stage,"generate_title");assert.equal(h.calls.filter,1);assert.equal(h.calls.score,1);
            } finally {h.cleanup();}
          });
          test("API failure retains paid attempt and stops after two",async()=>{
            const h=await harness({throwScore:true});
            try {
              await assert.rejects(h.run(),/AI_SCORE_TIMEOUT/);assert.equal(h.get().checkpoint_payload.selectionRecovery.attempts,1);
              await assert.rejects(h.run(),/AI_SCORE_TIMEOUT/);assert.equal(h.get().checkpoint_payload.selectionRecovery.attempts,2);
              await assert.rejects(h.run(),/기준 미충족/);assert.equal(h.calls.score,2);assert.equal(h.calls.filter,0);
            } finally {h.cleanup();}
          });
          test("production threshold and category/safety gate constants remain unchanged",async()=>{
            const selection=await readFile(new URL("../src/lib/keywordEngineElonLabV2Selection.ts",import.meta.url),"utf8");
            const scoring=await readFile(new URL("../src/lib/keywordEngineElonLabV2Scoring.ts",import.meta.url),"utf8");
            assert.match(selection,/DEFAULT_DEMAND_QUALITY = 65/);assert.match(selection,/DEFAULT_ACCURACY_RELEVANCE = 90/);
            assert.match(scoring,/CATEGORY_MATCH_GATE = 85/);assert.match(scoring,/row\.relevance >= 85/);
            assert.match(scoring,/calculated\.safetyPass && categoryAligned/);
          });
          ''')
          ci = '.github/workflows/legacy-seo-registration-ci.yml'
          replace(ci, "      - 'src/lib/legacySeoPreflight.ts'", "      - 'src/lib/legacySeoPreflight.ts'\n      - 'src/lib/legacySeoRunWorker.ts'\n      - 'src/lib/keywordEngineElonSelectionRecovery.ts'\n      - 'src/lib/keywordEngineElonLabV2Discovery.ts'\n      - 'src/lib/keywordEngineElonLabV2Scoring.ts'\n      - 'tests/keywordEngineElonSelectionRecovery.test.mjs'")
          replace(ci, '          tests/legacySeoRegistrationPolicy.test.mjs\n', '          tests/legacySeoRegistrationPolicy.test.mjs\n          tests/keywordEngineElonSelectionRecovery.test.mjs\n')
          PY
      - run: npm ci
      - name: Test recovery and existing registration safeguards
        run: node --experimental-strip-types --test tests/keywordEngineElonSelectionRecovery.test.mjs tests/legacySeoRegistrationPolicy.test.mjs tests/legacySeoShoplingSyncState.test.mjs tests/legacySeoShoplingOptionSyncSafety.test.mjs tests/legacySeoShoplingEvidenceStaleFallback.test.mjs tests/legacySeoBulkRunAll.test.mjs tests/legacySeoBulkLoading.test.mjs tests/legacySeoStockRecovery.test.mjs tests/legacySeoShoplingPayload.test.mjs tests/legacySeoShoplingPriceRecovery.test.mjs
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Commit tested patch to isolated branch and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/legacy-seo-seed-recovery-20260912 | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/temporary-legacy-seo-seed-repair.yml
          git add src/lib/keywordEngineElonSelectionRecovery.ts src/lib/legacySeoRunWorker.ts src/lib/keywordEngineElonLabV2Discovery.ts src/lib/keywordEngineElonLabV2Scoring.ts tests/keywordEngineElonSelectionRecovery.test.mjs .github/workflows/legacy-seo-registration-ci.yml
