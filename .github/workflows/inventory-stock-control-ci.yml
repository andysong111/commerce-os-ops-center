name: Inventory Stock Control CI

on:
  push:
    branches: [main]
    paths:
      - "src/lib/inventoryStockControl.ts"
      - "src/lib/inventoryStockSalesTail.ts"
      - "src/lib/productMasterVerifiedInventoryBaselines.ts"
      - "src/app/api/inventory-stock-control/route.ts"
      - "src/app/api/inventory-stock-control/sync/route.ts"
      - "src/lib/supabase/admin.ts"
      - "src/lib/shopling/shoplingOptionStatus.ts"
      - "supabase/migrations/202609130001_inventory_tail_latest_view.sql"
      - "supabase/migrations/202609130002_inventory_tail_latest_normalized_time.sql"
      - "supabase/migrations/202609130003_inventory_tail_latest_snapshot_validation.sql"
      - "public/shopling-stock-state-sync/**"
      - "tests/inventoryStockControlReentry.test.mjs"
      - "tests/inventoryStockProductMasterBridge.test.mjs"
      - "tests/inventoryStockTailLatestView.test.mjs"
      - "tests/helpers/purchaseCycleHarness.mjs"
      - "tests/supabaseAdminReadRetry.test.mjs"
      - ".github/workflows/inventory-stock-control-ci.yml"
  pull_request:
    paths:
      - "src/lib/inventoryStockControl.ts"
      - "src/lib/inventoryStockSalesTail.ts"
      - "src/lib/productMasterVerifiedInventoryBaselines.ts"
      - "src/app/api/inventory-stock-control/route.ts"
      - "src/app/api/inventory-stock-control/sync/route.ts"
      - "src/lib/supabase/admin.ts"
      - "src/lib/shopling/shoplingOptionStatus.ts"
      - "supabase/migrations/202609130001_inventory_tail_latest_view.sql"
      - "supabase/migrations/202609130002_inventory_tail_latest_normalized_time.sql"
      - "supabase/migrations/202609130003_inventory_tail_latest_snapshot_validation.sql"
      - "public/shopling-stock-state-sync/**"
      - "tests/inventoryStockControlReentry.test.mjs"
      - "tests/inventoryStockProductMasterBridge.test.mjs"
      - "tests/inventoryStockTailLatestView.test.mjs"
      - "tests/helpers/purchaseCycleHarness.mjs"
      - "tests/supabaseAdminReadRetry.test.mjs"
      - ".github/workflows/inventory-stock-control-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-stock-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run stock-control, Product Master, bounded Tail and Supabase read regression tests
        run: node --experimental-strip-types --test tests/inventoryStockControlReentry.test.mjs tests/inventoryStockProductMasterBridge.test.mjs tests/inventoryStockTailLatestView.test.mjs tests/supabaseAdminReadRetry.test.mjs
