name: Inventory Stock Control CI

on:
  push:
    branches: [main]
    paths:
      - "src/lib/inventoryStockControl.ts"
      - "src/lib/supabase/admin.ts"
      - "src/lib/shopling/shoplingOptionStatus.ts"
      - "public/shopling-stock-state-sync/**"
      - "tests/inventoryStockControlReentry.test.mjs"
      - "tests/supabaseAdminReadRetry.test.mjs"
      - ".github/workflows/inventory-stock-control-ci.yml"
  pull_request:
    paths:
      - "src/lib/inventoryStockControl.ts"
      - "src/lib/supabase/admin.ts"
      - "src/lib/shopling/shoplingOptionStatus.ts"
      - "public/shopling-stock-state-sync/**"
      - "tests/inventoryStockControlReentry.test.mjs"
      - "tests/supabaseAdminReadRetry.test.mjs"
      - ".github/workflows/inventory-stock-control-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-stock-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run restock / ON_SALE and Supabase read-retry regression tests
        run: node --experimental-strip-types --test tests/inventoryStockControlReentry.test.mjs tests/supabaseAdminReadRetry.test.mjs
