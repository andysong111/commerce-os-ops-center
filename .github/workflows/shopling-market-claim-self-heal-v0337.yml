name: Shopling Market Claim Self Heal v0.3.37
on:
  pull_request:
    paths:
      - 'src/app/api/shopling-market-group-canary/v0337/claim/route.ts'
      - 'src/lib/shoplingMarketClaimSelfHealV0337.ts'
      - 'tests/shoplingMarketClaimSelfHealV0337.test.mjs'
      - '.github/workflows/shopling-market-claim-self-heal-v0337.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopling-market-claim-self-heal-v0337-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify stale-claim and missing-ledger self-heal guards
        run: node --experimental-strip-types --test tests/shoplingMarketClaimSelfHealV0337.test.mjs
      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
