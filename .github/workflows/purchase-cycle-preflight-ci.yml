name: Purchase Cycle Preflight CI

on:
  pull_request:
    paths:
      - 'src/lib/purchaseCyclePreflight*.ts'
      - 'src/lib/purchaseReplacementDraftLineage.ts'
      - 'src/lib/purchaseCycleDraftRegenerationCore.ts'
      - 'src/components/china-order-manager/InternalChinaPurchaseDraftWorkspaceV2.tsx'
      - 'src/lib/purchaseStrategyState.ts'
      - 'src/lib/purchaseSalesFreshness.ts'
      - 'src/lib/stage7PurchaseCostEvidenceReadiness.ts'
      - 'src/lib/verifiedPurchaseCostEvidence.ts'
      - 'src/lib/stage8InventoryVerificationPriority.ts'
      - 'src/lib/purchaseCandidateOmissionAudit.ts'
      - 'src/lib/productLaunchPurchaseMetadata.ts'
      - 'src/lib/productLaunchPurchaseMetadataCore.ts'
      - 'src/lib/productDecisionEngine/**'
      - 'src/lib/shopling/shoplingLiveAggregation.ts'
      - 'src/lib/purchaseCycleClosureCore.ts'
      - 'src/lib/opsModuleRegistry.ts'
      - 'src/lib/manualSourcingDraftStorage.ts'
      - 'src/app/stage7-purchase-cost-evidence/**'
      - 'src/app/purchase-cycle-preflight/**'
      - 'src/app/api/purchase-strategy/**'
      - 'src/components/purchase-cycle-preflight/**'
      - 'src/components/sourcing-center/ManualProductIntakeForm.tsx'
      - 'tests/purchaseCyclePreflight*.test.mjs'
      - 'tests/purchaseDraftBatchRecalculation.test.mjs'
      - 'tests/purchaseStrategyState.test.mjs'
      - 'tests/manualSourcingDraftStorage.test.mjs'
      - 'tests/stage7PurchaseCostEvidence.test.mjs'
      - 'tests/stage8InventoryVerificationPriority.test.mjs'
      - 'tests/purchaseCandidateOmissionAudit.test.mjs'
      - 'tests/productLaunchPurchaseMetadata.test.mjs'
      - 'tests/productDecisionEngine.test.mjs'
      - 'tests/purchaseStrategyPolicy.test.mjs'
      - '.github/workflows/purchase-cycle-preflight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-and-closure-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Behavioral preflight and existing order-receipt closure tests
        run: node --experimental-strip-types --test tests/manualSourcingDraftStorage.test.mjs tests/productDecisionEngine.test.mjs tests/productLaunchPurchaseMetadata.test.mjs tests/purchaseCandidateOmissionAudit.test.mjs tests/purchaseCyclePreflight.test.mjs tests/purchaseCyclePreflightClosure.test.mjs tests/purchaseCyclePreflightDraft.test.mjs tests/purchaseCyclePreflightSpend.test.mjs tests/purchaseDraftBatchRecalculation.test.mjs tests/purchaseStrategyPolicy.test.mjs tests/purchaseStrategyState.test.mjs tests/purchaseWholesaleCostEstimate.test.mjs tests/stage7PurchaseCostEvidence.test.mjs tests/stage8InventoryVerificationPriority.test.mjs
      - name: Lint changed runtime and tests
        run: npx eslint src/lib/productDecisionEngine/*.ts src/lib/productDecisionSnapshot.ts src/lib/purchaseCyclePreflight*.ts src/lib/purchaseReplacementDraftLineage.ts src/lib/purchaseCycleDraftRegenerationCore.ts src/lib/purchaseStrategyState.ts src/lib/purchaseCandidateOmissionAudit.ts src/lib/productLaunchPurchaseMetadata.ts src/lib/productLaunchPurchaseMetadataCore.ts src/lib/shopling/shoplingLiveAggregation.ts src/lib/purchaseSalesFreshness.ts src/lib/manualSourcingDraftStorage.ts src/lib/purchaseWholesaleCostEstimate.ts src/lib/stage7PurchaseCostEvidenceReadiness.ts src/lib/verifiedPurchaseCostEvidence.ts src/lib/stage8InventoryVerificationPriority.ts src/lib/opsModuleRegistry.ts src/app/api/purchase-strategy/route.ts src/app/purchase-cycle-preflight/page.tsx src/components/purchase-cycle-preflight/*.tsx src/components/china-order-manager/InternalChinaPurchaseDraftWorkspaceV2.tsx src/components/sourcing-center/ManualProductIntakeForm.tsx src/app/stage7-purchase-cost-evidence/page.tsx tests/manualSourcingDraftStorage.test.mjs tests/productDecisionEngine.test.mjs tests/productLaunchPurchaseMetadata.test.mjs tests/purchaseCandidateOmissionAudit.test.mjs tests/purchaseCyclePreflight*.test.mjs tests/purchaseDraftBatchRecalculation.test.mjs tests/purchaseStrategyPolicy.test.mjs tests/purchaseStrategyState.test.mjs tests/purchaseWholesaleCostEstimate.test.mjs tests/stage7PurchaseCostEvidence.test.mjs tests/stage8InventoryVerificationPriority.test.mjs
      - name: Full application build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://purchase-preflight-build.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_purchase_preflight_build
