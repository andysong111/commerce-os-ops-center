name: Apply semantic builder imports
on:
  push:
    branches: [fix/semantic-option-names-20260913]
    paths: [.github/workflows/semantic-options-import-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/semantic-option-names-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-option-names-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['productLaunchTrackerShopling.ts','legacySeoShoplingPayload.ts']:
              p=Path('src/lib')/name
              s=p.read_text()
              assert s.count('"@/lib/productLaunchOptionNames"')==1
              s=s.replace('"@/lib/productLaunchOptionNames"','"./productLaunchOptionNames.ts"')
              if name=='legacySeoShoplingPayload.ts':
                  assert s.count('"@/lib/productLaunchTrackerShopling"')==1
                  s=s.replace('"@/lib/productLaunchTrackerShopling"','"./productLaunchTrackerShopling.ts"')
              p.write_text(s)
          PY
      - run: npm ci
      - run: node --experimental-strip-types --test tests/productLaunchOptionNames.test.mjs tests/productLaunchOptionPayload.test.mjs tests/legacySeoShoplingPayload.test.mjs tests/productLaunchTrackerBarcodeMapping.test.mjs
      - name: Commit only tested source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/productLaunchTrackerShopling.ts src/lib/legacySeoShoplingPayload.ts
          git commit -m 'fix(options): keep pure payload builders compatible with native Node regression tests'
          git push origin HEAD:fix/semantic-option-names-20260913
