name: SEO Title Inventory Ledger CI

on:
  pull_request:
    paths:
      - "src/app/api/seo-title-ledger/**"
      - "src/app/api/seo-title-dispatch/**"
      - "src/app/api/seo-run-jobs/**"
      - "src/app/api/seo-run-wakeup/**"
      - "src/app/api/cron/seo-run-worker/**"
      - "src/app/api/keyword-engine-elon-lab/route.ts"
      - "src/app/keyword-engine-elon-lab/SeoTitleLedger*.tsx"
      - "src/app/keyword-engine-elon-lab/layout.tsx"
      - "src/app/shopling-seo-dispatch/**"
      - "src/app/product-launch-tracker/page.tsx"
      - "src/app/seo-bulk-cloud/**"
      - "src/lib/seoTitle*"
      - "src/lib/seoRun*"
      - "src/lib/keywordEngineElonBulkFinal.ts"
      - "src/lib/keywordEngineElonLabV2Scoring.ts"
      - "src/lib/keywordEngineElonFreshMallTitleComposer.ts"
      - "src/lib/keywordEngineElonMallTitleIntentPortfolioV7.ts"
      - "src/lib/keywordEngineElonMallTitleDiversityV8.ts"
      - "src/lib/keywordEngineElonSameMallTitleDiversityV9.ts"
      - "src/lib/keywordEngineElonBulkKeywordRecovery.ts"
      - "src/lib/keywordEngineElonTitleExpansion.ts"
      - "src/lib/keywordEngineElonLongTitlePriority.ts"
      - "src/lib/keywordEngineElonMallTitleSafeComposer.ts"
      - "src/lib/shoplingSeoDispatchModule.ts"
      - "src/lib/keywordEngineElonLabModule.ts"
      - "src/lib/opsModuleRegistry.ts"
      - "public/product-launch-tracker-app/seo-title-ledger-handoff.js"
      - "public/product-launch-tracker-app/app.js"
      - "supabase/migrations/202608220001_seo_title_inventory_ledger.sql"
      - "supabase/migrations/202608220002_fix_seo_title_inventory_trigger.sql"
      - "supabase/migrations/202608280001_seo_run_durable_jobs.sql"
      - "supabase/migrations/202608280002_seo_run_same_item_serial_claim.sql"
      - "supabase/migrations/202608280003_seo_run_retry_and_title_chaining.sql"
      - "supabase/migrations/202608280004_seo_run_supabase_wakeup.sql"
      - "supabase/migrations/202608280005_seo_run_opaque_secret_rpc_compat.sql"
      - "supabase/migrations/202608280008_optimize_seo_claim_and_remove_duplicate_wakeup.sql"
      - "tests/seoTitleInventoryLedger.test.mjs"
      - "tests/seoTitleFinalKeywordInventoryGenerator.test.mjs"
      - "tests/seoTitleV4MinLengthContract.test.mjs"
      - "tests/keywordEngineElonLabSeoOutput.test.mjs"
      - "tests/keywordEngineElonMallTitleSafeComposer.test.mjs"
      - "tests/seoCategoryIntentExpansionV5.test.mjs"
      - "tests/seoBulkMallTitleFactBridge.test.mjs"
      - "tests/seoBulkCloudParallel.test.mjs"
      - "tests/seoBulkLongTitleV6UpgradeBridge.test.mjs"
      - "tests/seoRunDurableWorker.test.mjs"
      - "tests/seoRunClaimLoadShedding.test.mjs"
      - "tests/seoCloudPerformance.test.mjs"
      - "vercel.json"
      - ".github/workflows/seo-title-inventory-ledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint SEO title inventory and durable RUN files
        run: >-
          npx eslint
          src/app/api/seo-title-ledger/route.ts
          src/app/api/seo-title-dispatch/route.ts
          src/app/api/seo-run-jobs/route.ts
          src/app/api/seo-run-wakeup/route.ts
          src/app/api/cron/seo-run-worker/route.ts
          src/app/api/keyword-engine-elon-lab/route.ts
          src/app/keyword-engine-elon-lab/SeoTitleLedgerControlPanel.tsx
          src/app/keyword-engine-elon-lab/SeoTitleLedgerLaunchHandoff.tsx
          src/app/keyword-engine-elon-lab/SeoTitleLedgerPageIdentityBridge.tsx
          src/app/keyword-engine-elon-lab/layout.tsx
          src/app/shopling-seo-dispatch/page.tsx
          src/app/shopling-seo-dispatch/ShoplingSeoDispatchCenter.tsx
          src/app/product-launch-tracker/page.tsx
          src/app/seo-bulk-cloud/page.tsx
          src/app/seo-bulk-cloud/SeoBulkDurableRunCloudClient.tsx
          src/app/seo-bulk-cloud/SeoBulkLongTitleV6UpgradeBridge.tsx
          src/lib/seoRunJobServer.ts
          src/lib/seoRunJobHistory.ts
          src/lib/seoRunWorker.ts
          src/lib/seoRunWorkerControl.ts
          src/lib/keywordEngineElonBulkFinal.ts
          src/lib/keywordEngineElonLabV2Scoring.ts
          src/lib/keywordEngineElonFreshMallTitleComposer.ts
          src/lib/keywordEngineElonTitleExpansion.ts
          src/lib/keywordEngineElonLongTitlePriority.ts
          src/lib/keywordEngineElonMallTitleSafeComposer.ts
          src/lib/seoTitleInventoryGenerator.ts
          src/lib/seoTitleFinalKeywordInventoryGenerator.ts
          src/lib/seoTitleBulkInventorySync.ts
          src/lib/seoTitleLedgerServer.ts
          src/lib/shoplingSeoDispatchModule.ts
          src/lib/keywordEngineElonLabModule.ts
          src/lib/opsModuleRegistry.ts
          tests/seoRunClaimLoadShedding.test.mjs
          tests/seoCategoryIntentExpansionV5.test.mjs
          tests/seoRunDurableWorker.test.mjs
      - name: Test title inventory, durable RUN, no-reuse and performance contracts
        run: >-
          node --experimental-strip-types --test
          tests/seoTitleInventoryLedger.test.mjs
          tests/seoTitleFinalKeywordInventoryGenerator.test.mjs
          tests/seoTitleV4MinLengthContract.test.mjs
          tests/keywordEngineElonLabSeoOutput.test.mjs
          tests/keywordEngineElonMallTitleSafeComposer.test.mjs
          tests/seoCategoryIntentExpansionV5.test.mjs
          tests/seoBulkMallTitleFactBridge.test.mjs
          tests/seoBulkCloudParallel.test.mjs
          tests/seoBulkLongTitleV6UpgradeBridge.test.mjs
          tests/seoRunDurableWorker.test.mjs
          tests/seoRunClaimLoadShedding.test.mjs
          tests/seoCloudPerformance.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://seo-title-ledger-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_seo_title_ledger_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
