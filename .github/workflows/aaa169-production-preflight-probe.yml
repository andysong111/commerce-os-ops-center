name: Legacy SEO Full Production Preflight Probe

on:
  pull_request:
    paths:
      - '.github/workflows/aaa169-production-preflight-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run production preflight for every unblocked legacy candidate
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          headers=(
            --header 'Accept: application/json'
            --header 'Origin: https://commerce-os-ops-center.vercel.app'
            --header 'Sec-Fetch-Site: same-origin'
          )

          inventory="$(mktemp)"
          inventory_status="$(curl --silent --show-error --max-time 300 \
            --output "$inventory" --write-out '%{http_code}' \
            "${headers[@]}" \
            "$base/api/legacy-seo-run-jobs")"
          echo "INVENTORY_HTTP_STATUS=$inventory_status"
          if [[ "$inventory_status" != '200' ]]; then
            cat "$inventory"
            exit 1
          fi

          all_ids="$(mktemp)"
          blocked_ids="$(mktemp)"
          target_ids="$(mktemp)"
          jq -r '.items[]?.id // empty' "$inventory" | sort -u > "$all_ids"
          jq -r '.jobs[]? | select(.status == "queued" or .status == "running" or .status == "ready") | .launch_item_id // empty' "$inventory" | sort -u > "$blocked_ids"
          if [[ -s "$blocked_ids" ]]; then
            grep -vxFf "$blocked_ids" "$all_ids" > "$target_ids" || true
          else
            cp "$all_ids" "$target_ids"
          fi

          candidate_count="$(wc -l < "$all_ids" | tr -d ' ')"
          blocked_count="$(wc -l < "$blocked_ids" | tr -d ' ')"
          target_count="$(wc -l < "$target_ids" | tr -d ' ')"
          echo "CANDIDATE_COUNT=$candidate_count"
          echo "BLOCKED_COUNT=$blocked_count"
          echo "TARGET_COUNT=$target_count"

          if [[ "$target_count" == '0' ]]; then
            echo 'No unblocked legacy candidates remain.'
            exit 0
          fi

          workdir="$(mktemp -d)"
          split -l 50 -d -a 3 "$target_ids" "$workdir/chunk-"

          total_requested=0
          total_ready=0
          total_excluded=0
          total_failed=0
          total_issues=0
          chunk_index=0
          failure_log="$workdir/failures.jsonl"
          exclusion_log="$workdir/exclusions.jsonl"
          : > "$failure_log"
          : > "$exclusion_log"

          for chunk in "$workdir"/chunk-*; do
            [[ -f "$chunk" ]] || continue
            chunk_index=$((chunk_index + 1))
            payload="$workdir/payload-$chunk_index.json"
            response="$workdir/response-$chunk_index.json"
            jq -R -s 'split("\n") | map(select(length > 0)) | {itemIds: .}' "$chunk" > "$payload"

            status="$(curl --silent --show-error --max-time 320 \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              "${headers[@]}" \
              --header 'Content-Type: application/json' \
              --data-binary "@$payload" \
              "$base/api/legacy-seo-preflight")"

            if [[ "$status" != '200' && "$status" != '422' ]]; then
              echo "CHUNK_${chunk_index}_HTTP_STATUS=$status"
              cat "$response"
              exit 1
            fi

            requested="$(jq -r '.requestedCount // 0' "$response")"
            ready="$(jq -r '.readyCount // 0' "$response")"
            excluded="$(jq -r '.excludedCount // 0' "$response")"
            failed="$(jq -r '.failedCount // 0' "$response")"
            issues="$(jq -r '.issueCount // 0' "$response")"
            total_requested=$((total_requested + requested))
            total_ready=$((total_ready + ready))
            total_excluded=$((total_excluded + excluded))
            total_failed=$((total_failed + failed))
            total_issues=$((total_issues + issues))

            echo "CHUNK_${chunk_index}: status=$status requested=$requested ready=$ready excluded=$excluded failed=$failed issues=$issues"

            jq -c '.results[]? | select(.ready != true and .excluded != true) | {itemId,modelNumber,issues}' "$response" >> "$failure_log"
            jq -c '.results[]? | select(.excluded == true) | {itemId,modelNumber,issues}' "$response" >> "$exclusion_log"
          done

          echo "TOTAL_REQUESTED=$total_requested"
          echo "TOTAL_READY=$total_ready"
          echo "TOTAL_EXCLUDED=$total_excluded"
          echo "TOTAL_FAILED=$total_failed"
          echo "TOTAL_ISSUES=$total_issues"

          if [[ -s "$exclusion_log" ]]; then
            echo '--- EXCLUSIONS ---'
            cat "$exclusion_log"
          fi
          if [[ -s "$failure_log" ]]; then
            echo '--- FAILURES ---'
            cat "$failure_log"
          fi

          if (( total_failed > 0 )); then
            exit 2
          fi
