name: Apply option-aware monthly price patch
on:
  push:
    branches: [agent/monthly-price-option-aware-20260922]
    paths:
      - '.agent/monthly-price-option-aware/**'
      - '.github/workflows/agent-monthly-price-option-aware-apply.yml'
permissions:
  contents: write
concurrency:
  group: agent-monthly-price-option-aware-apply
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monthly-price-option-aware-20260922
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/monthly-price-option-aware/part-*.patch > /tmp/monthly-price-option-aware.patch
          git apply --check /tmp/monthly-price-option-aware.patch
          git apply /tmp/monthly-price-option-aware.patch
          rm -rf .agent/monthly-price-option-aware
          rm -f .github/workflows/agent-monthly-price-option-aware-apply.yml
          git config user.name "commerce-os-agent"
          git config user.email "commerce-os-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat: option-aware monthly price adjustment"
          git push origin HEAD:agent/monthly-price-option-aware-20260922
