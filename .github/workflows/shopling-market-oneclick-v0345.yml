name: Shopling Market One Click v0.3.45
on:
  pull_request:
    paths:
      - 'src/lib/shoplingMarketAdminHostV0345.ts'
      - 'src/app/api/shopling-market-group-canary/v0345/**'
      - 'src/app/seo-bulk-cloud/SeoBulkShoplingOneClickControl.tsx'
      - 'tests/shoplingMarketAdminHostV0345.test.mjs'
      - '.github/workflows/shopling-market-oneclick-v0345.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopling-oneclick-v0345-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify v0.3.45 KT admin host regression
        run: node --experimental-strip-types --test tests/shoplingMarketAdminHostV0345.test.mjs tests/shoplingMarketBridgeManifestV0344.test.mjs tests/shoplingMarketOneClickBackgroundV0343.test.mjs tests/shoplingMarketGroupCanaryV0330.test.mjs
      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Generate and inspect actual extension ZIP
        run: |
          npm run start -- --port 3100 > /tmp/shopling-v0345-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/shopling-market-group-canary/v0345/download -o /tmp/commerce-os-shopling-market-sender-v0.3.45.zip; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, pathlib, zipfile
          archive=pathlib.Path('/tmp/commerce-os-shopling-market-sender-v0.3.45.zip')
          assert archive.is_file() and archive.stat().st_size > 1000
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='0.3.45'
              content=z.read('content-group-canary.mjs').decode()
              background=z.read('background-root.mjs').decode()
              agent=z.read('shopling-market-auto-agent.mjs').decode()
              assert content.count('kt.shopling.co.kr') == 2
              assert '["a.shopling.co.kr","kt.shopling.co.kr"].includes(parsed.hostname)' in background
              assert agent.count('__commerceOsShoplingMarketAutoAgentV0343') == 2
              assert '__commerceOsShoplingMarketAutoAgentV0330' not in agent
              z.extractall('/tmp/shopling-v0345')
          PY
          for file in /tmp/shopling-v0345/*.js /tmp/shopling-v0345/*.mjs; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: shopling-market-sender-v0345
          path: /tmp/commerce-os-shopling-market-sender-v0.3.45.zip
          retention-days: 7
