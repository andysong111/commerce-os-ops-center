name: Shopling Market One Click v0.3.46
on:
  pull_request:
    paths:
      - 'src/lib/shoplingMarketA19KeywordAuditV0346.ts'
      - 'src/lib/seoProhibitedKeywordPolicy.ts'
      - 'src/lib/shoplingMarketAutoOrchestrationServer.ts'
      - 'src/app/api/shopling-market-auto-orchestration/route.ts'
      - 'src/app/api/shopling-market-group-canary/v0346/**'
      - 'src/app/api/shopling-market-group-canary/download/route.ts'
      - 'src/app/api/seo-run-custom-blocked-terms/route.ts'
      - 'src/app/api/seo-run-jobs/route.ts'
      - 'src/app/api/legacy-seo-run-jobs/**'
      - 'src/app/api/legacy-seo-run-jobs-enqueue/**'
      - 'src/app/seo-bulk-cloud/SeoBulkCustomBlockedTermsPanel.tsx'
      - 'src/app/seo-bulk-cloud/SeoBulkShoplingOneClickControl.tsx'
      - 'tests/shoplingMarketA19KeywordAuditV0346.test.mjs'
      - 'tests/shoplingMarketGroupCanary.test.mjs'
      - '.github/workflows/shopling-market-oneclick-v0346.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopling-oneclick-v0346-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-policy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify A19 parser, policy and inherited market bridge
        run: node --experimental-strip-types --test tests/shoplingMarketA19KeywordAuditV0346.test.mjs tests/shoplingMarketAdminHostV0345.test.mjs tests/shoplingMarketBridgeManifestV0344.test.mjs tests/shoplingMarketOneClickBackgroundV0343.test.mjs tests/shoplingMarketGroupCanaryV0330.test.mjs tests/shoplingMarketGroupCanary.test.mjs
      - run: npm run typecheck
      - name: Build production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Generate and inspect actual v0.3.46 extension ZIP
        run: |
          npm run start -- --port 3100 > /tmp/shopling-v0346-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/shopling-market-group-canary/v0346/download -o /tmp/commerce-os-shopling-market-sender-v0.3.46.zip; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, pathlib, zipfile
          archive=pathlib.Path('/tmp/commerce-os-shopling-market-sender-v0.3.46.zip')
          assert archive.is_file() and archive.stat().st_size > 1000
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['version']=='0.3.46'
              scripts=[entry for entry in manifest.get('content_scripts', []) if 'shopling-a19-keyword-auditor.mjs' in entry.get('js', [])]
              assert len(scripts)==1
              assert set(scripts[0]['matches'])=={
                  'https://a.shopling.co.kr/prodlinkage/goods_mallReg_failList.phtml*',
                  'https://kt.shopling.co.kr/prodlinkage/goods_mallReg_failList.phtml*',
              }
              auditor=z.read('shopling-a19-keyword-auditor.mjs').decode()
              background=z.read('background-root.mjs').decode()
              agent=z.read('shopling-market-auto-agent.mjs').decode()
              assert 'a19_search_controls_missing' in auditor
              assert 'a19AuditReceipt' in background
              assert 'auditAndReport' in agent
              assert '상품 재전송' not in auditor
              z.extractall('/tmp/shopling-v0346')
          PY
          for file in /tmp/shopling-v0346/*.js /tmp/shopling-v0346/*.mjs; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: shopling-market-sender-v0346
          path: /tmp/commerce-os-shopling-market-sender-v0.3.46.zip
          retention-days: 7
