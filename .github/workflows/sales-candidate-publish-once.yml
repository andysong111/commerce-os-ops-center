name: Owner Verified Sales Publication Once
on:
  push:
    branches: [ops/sales-candidate-collect-20260915]
    paths: [.github/workflows/sales-candidate-publish-once.yml]
permissions:
  contents: read
concurrency:
  group: owner-sales-candidate-collection-20260915
  cancel-in-progress: false
jobs:
  verified-canonical-only:
    if: github.repository == 'andysong111/commerce-os-ops-center'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify pinned-plan network boundary before production navigation
        run: node scripts/ops/sales-candidate-publish-20260915.mjs --self-test
      - run: npm install --prefix "$RUNNER_TEMP/sales-browser" --no-package-lock --no-audit --no-fund playwright@1.55.1
      - run: '"$RUNNER_TEMP/sales-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Only existing verified canonical canary/full gate; no orders, payment or stock mutations
        env:
          SALES_BROWSER_TOOLS: ${{ runner.temp }}/sales-browser
          SALES_PUBLICATION_AUTHORIZATION: OWNER_AUTHORIZED_VERIFIED_CANONICAL_SALES_ONLY
        run: node scripts/ops/sales-candidate-publish-20260915.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-sales-publication-readback
          path: artifacts/sales-candidate-publish-20260915/result.json
          retention-days: 7
          if-no-files-found: warn
