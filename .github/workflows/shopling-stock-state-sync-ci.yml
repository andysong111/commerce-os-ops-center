name: Shopling Stock State Sync Regression

on:
  pull_request:
    paths:
      - "public/shopling-stock-state-sync/**"
      - "scripts/build-shopling-stock-worker-v030.mjs"
      - "src/app/api/shopling-stock-state-sync/**"
      - "src/app/api/inventory-stock-control/sync/**"
      - "src/app/api/inventory-stock-control/shopling-option-status/**"
      - "src/app/api/inventory-stock-control/shopling-bcode-index/**"
      - "src/app/api/inventory-stock-control/route.ts"
      - "src/lib/shopling/shoplingBcodeIndex*.ts"
      - "src/lib/shopling/shoplingOptionStatus.ts"
      - "src/lib/shopling/shoplingProductStatus.ts"
      - "src/lib/inventoryStockSalesTail.ts"
      - "src/lib/inventoryStockSalesTailCoverage.ts"
      - "src/lib/inventoryStockSyncResolution.ts"
      - "src/lib/shoplingStockHf*.ts"
      - "src/lib/shoplingStockReadyBarrier.ts"
      - "src/lib/shoplingDirectRunProgress.ts"
      - "src/lib/shoplingDirectRunRecovery.ts"
      - "src/components/china-order-manager/InventoryStockoutOperatorPanel.tsx"
      - "src/components/china-order-manager/StockSyncOperationalQueuePanel.tsx"
      - "src/app/china-order-manager/stock-control/**"
      - "tests/shoplingStockStateRouteGuard.test.mjs"
      - "tests/shoplingStockStateExtension.test.mjs"
      - "tests/shoplingStockStateSyncV041.test.mjs"
      - "tests/shoplingStockStateHf36.test.mjs"
      - "tests/shoplingStockStateHf37.test.mjs"
      - "tests/shoplingStockStateHf38.test.mjs"
      - "tests/shoplingStockStateHf39.test.mjs"
      - "tests/shoplingStockStateHf40.test.mjs"
      - "tests/shoplingStockStateHf41.test.mjs"
      - "tests/shoplingStockStateHf42.test.mjs"
      - "tests/shoplingStockStateHf46.test.mjs"
      - "tests/shoplingStockStateHf47.test.mjs"
      - "tests/shoplingStockStateHf48.test.mjs"
      - "tests/shoplingStockStateHf49.test.mjs"
      - "tests/shoplingStockStateHf50.test.mjs"
      - "tests/shoplingStockStateHf52.test.mjs"
      - "tests/shoplingStockStateHf53.test.mjs"
      - "tests/shoplingStockStateHf54.test.mjs"
      - "tests/shoplingStockStateHf57.test.mjs"
      - "tests/shoplingStockStateHf58.test.mjs"
      - "tests/shoplingStockStateHf59.test.mjs"
      - "tests/shoplingStockStateHf60.test.mjs"
      - "tests/shoplingStockStateHf61.test.mjs"
      - "tests/shoplingStockStateHf62.test.mjs"
      - "tests/shoplingStockStateHf63.test.mjs"
      - "tests/shoplingStockStateHf64.test.mjs"
      - "tests/shoplingStockApiFirstHf65.test.mjs"
      - "tests/shoplingStockHf66PageChannel.test.mjs"
      - "tests/shoplingOptionStatusUnmanagedQuantity.test.mjs"
      - "supabase/migrations/*shopling_bcode_option_index*.sql"
      - "tests/shoplingStockReadyBarrier.test.mjs"
      - "tests/shoplingDirectRunProgress.test.mjs"
      - "tests/shoplingDirectRunRecovery.test.mjs"
      - "tests/inventoryStockRetransmission.test.mjs"
      - "tests/shoplingStockWatchdogHeartbeat.test.mjs"
      - "tests/shoplingOptionA21BatchHF29.test.mjs"
      - "tests/inventoryStockSalesTail.test.mjs"
      - "tests/inventoryStockSyncTimeoutRetry.test.mjs"
      - ".github/workflows/shopling-stock-state-sync-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-guard-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Syntax check stock sync extension scripts
        run: >-
          node --check public/shopling-stock-state-sync/menu-guard-v014.js
          && node --check public/shopling-stock-state-sync/menu-main-click-v015.js
          && node --check public/shopling-stock-state-sync/a6-role-marker-v016.js
          && node --check public/shopling-stock-state-sync/main-shopling.js
          && node --check public/shopling-stock-state-sync/content-shopling-v013.js
          && node --check public/shopling-stock-state-sync/background-v013.js
          && node --check public/shopling-stock-state-sync/content-ops-v013.js
          && node --check public/shopling-stock-state-sync/search-policy-v023.js
          && node --check public/shopling-stock-state-sync/background-v040.js
          && node --check public/shopling-stock-state-sync/content-ops-v021.js
          && node --check public/shopling-stock-state-sync/background-v070.js
          && node --check public/shopling-stock-state-sync/background-v071.js
          && node --check public/shopling-stock-state-sync/background-v073.js
          && node --check public/shopling-stock-state-sync/background-v074.js
          && node --check public/shopling-stock-state-sync/background-v077.js
          && node --check public/shopling-stock-state-sync/background-v078.js
          && node --check public/shopling-stock-state-sync/background-v079.js
          && node --check public/shopling-stock-state-sync/background-v081.js
          && node --check public/shopling-stock-state-sync/background-v082.js
          && node --check public/shopling-stock-state-sync/background-v083.js
          && node --check public/shopling-stock-state-sync/search-policy-v024.js
          && node --check public/shopling-stock-state-sync/background-v084.js
          && node --check public/shopling-stock-state-sync/background-v085.js
          && node --check public/shopling-stock-state-sync/a6-frame-evidence-v086.js
          && node --check public/shopling-stock-state-sync/background-v086.js
          && node --check public/shopling-stock-state-sync/content-ops-v022.js
          && node --check public/shopling-stock-state-sync/content-ops-v023.js
          && node --check public/shopling-stock-state-sync/background-v087.js
          && node --check public/shopling-stock-state-sync/content-ops-preflight-v002.js
          && node --check public/shopling-stock-state-sync/content-ops-heartbeat-v001.js
          && node --check public/shopling-stock-state-sync/popup.js
      - name: Regression - route guard
        run: node --test tests/shoplingStockStateRouteGuard.test.mjs
      - name: Regression - extension package
        run: node --test tests/shoplingStockStateExtension.test.mjs
      - name: Regression - heartbeat watchdog
        run: node --test tests/shoplingStockWatchdogHeartbeat.test.mjs
      - name: Regression - HF29 option A21 comma batch
        run: node --test tests/shoplingOptionA21BatchHF29.test.mjs
      - name: Regression - HF36 exact frame ownership
        run: node --test tests/shoplingStockStateHf36.test.mjs
      - name: Regression - HF37 empty A4 date controls
        run: node --experimental-strip-types --test tests/shoplingStockStateHf37.test.mjs
      - name: Regression - HF38 fresh A6 popup ownership
        run: node --experimental-strip-types --test tests/shoplingStockStateHf38.test.mjs
      - name: Regression - HF39 exact A4/A21 role and worker readiness
        run: node --experimental-strip-types --test tests/shoplingStockStateHf39.test.mjs
      - name: Regression - HF40 exact A4/A21 paths
        run: node --experimental-strip-types --test tests/shoplingStockStateHf40.test.mjs
      - name: Regression - HF41 long SINGLE result recovery
        run: node --experimental-strip-types --test tests/shoplingStockStateHf41.test.mjs
      - name: Regression - HF42 exact OPTION footer recovery
        run: node --experimental-strip-types --test tests/shoplingStockStateHf42.test.mjs
      - name: Regression - HF46 OPTION A21 worker readiness
        run: node --experimental-strip-types --test tests/shoplingStockStateHf46.test.mjs
      - name: Regression - HF47 popup opening stage acknowledgement
        run: node --experimental-strip-types --test tests/shoplingStockStateHf47.test.mjs
      - name: Regression - HF48 canonical message routing acknowledgement
        run: node --experimental-strip-types --test tests/shoplingStockStateHf48.test.mjs
      - name: Regression - HF49 exact owner across A21 page reload
        run: node --experimental-strip-types --test tests/shoplingStockStateHf49.test.mjs
      - name: Regression - HF50 login preflight and audited retransmission
        run: node --experimental-strip-types --test tests/shoplingStockStateHf50.test.mjs tests/inventoryStockRetransmission.test.mjs
      - name: Regression - HF52 durable first-lane resume
        run: node --experimental-strip-types --test tests/shoplingStockStateHf52.test.mjs
      - name: Regression - HF53 stale A21 popup preflight
        run: node --experimental-strip-types --test tests/shoplingStockStateHf53.test.mjs
      - name: Regression - HF54 bounded parallel login preflight
        run: node --experimental-strip-types --test tests/shoplingStockStateHf54.test.mjs
      - name: Regression - HF57 Shopling dispatch acceptance boundary
        run: node --experimental-strip-types --test tests/shoplingStockStateHf57.test.mjs
      - name: Regression - HF58 owner processing-screen acceptance
        run: node --experimental-strip-types --test tests/shoplingStockStateHf58.test.mjs
      - name: Regression - HF59 same-popup processing acceptance and reload recovery
        run: node --experimental-strip-types --test tests/shoplingStockStateHf59.test.mjs
      - name: Regression - HF60 nested A21 result owner chain
        run: node --experimental-strip-types --test tests/shoplingStockStateHf60.test.mjs
      - name: Regression - HF61 durable second-lane resume
        run: node --experimental-strip-types --test tests/shoplingStockStateHf61.test.mjs
      - name: Regression - HF62 exact-search resume and full batch continuation
        run: node --experimental-strip-types --test tests/shoplingStockStateHf62.test.mjs
      - name: Regression - HF63 replacement A6 owner and independent B-code attempts
        run: node --experimental-strip-types --test tests/shoplingStockStateHf63.test.mjs
      - name: Regression - HF64 serial B-code exact A6 result ownership
        run: node --experimental-strip-types --test tests/shoplingStockStateHf64.test.mjs tests/inventoryStockShoplingLaunchPlan.test.mjs
      - name: Regression - HF65 API-first B-code status and A21-only browser boundary
        run: node --experimental-strip-types --test tests/shoplingStockApiFirstHf65.test.mjs tests/shoplingOptionStatusUnmanagedQuantity.test.mjs tests/inventoryStockControl.test.mjs
      - name: Regression - HF66 exact HF27 Commerce OS page channel
        run: node --experimental-strip-types --test tests/shoplingStockHf66PageChannel.test.mjs
      - name: Regression - explicit idle acknowledgement between B-codes
        run: node --experimental-strip-types --test tests/shoplingStockReadyBarrier.test.mjs
      - name: Regression - explicit direct-run progress and completion summary
        run: node --experimental-strip-types --test tests/shoplingDirectRunProgress.test.mjs tests/shoplingDirectRunRecovery.test.mjs
      - name: Regression - v0.4.1 sync
        run: node --test tests/shoplingStockStateSyncV041.test.mjs
      - name: Regression - reset-tail coverage
        run: node --test tests/inventoryStockSalesTail.test.mjs
      - name: Regression - result-timeout retry
        run: node --test tests/inventoryStockSyncTimeoutRetry.test.mjs
