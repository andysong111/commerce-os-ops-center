name: Purchase Reentry Shadow CI
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/purchaseCycleReentry*'
      - 'src/lib/purchaseCycleStock*'
      - 'src/lib/chinaOrderLedger.ts'
      - 'src/lib/productDecisionEngine/purchaseV2.ts'
      - 'src/app/api/china-order-manager/reentry-shadow/**'
      - 'src/app/china-order-manager/reentry-shadow/**'
      - 'src/components/china-order-manager/PurchaseCycleReentryShadowPanel.tsx'
      - 'tests/purchaseCycleReentryShadow*'
      - '.github/workflows/purchase-reentry-shadow-ci.yml'
  pull_request:
    paths:
      - 'src/lib/purchaseCycleReentry*'
      - 'src/lib/purchaseCycleStock*'
      - 'src/lib/chinaOrderLedger.ts'
      - 'src/lib/productDecisionEngine/purchaseV2.ts'
      - 'src/app/api/china-order-manager/reentry-shadow/**'
      - 'src/app/china-order-manager/reentry-shadow/**'
      - 'src/components/china-order-manager/PurchaseCycleReentryShadowPanel.tsx'
      - 'tests/purchaseCycleReentryShadow*'
      - '.github/workflows/purchase-reentry-shadow-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: purchase-reentry-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint purchase recovery boundaries
        run: npx eslint src/lib/purchaseCycleReentryCommitments.ts src/lib/purchaseCycleReentryShadowCore.ts src/components/china-order-manager/PurchaseCycleReentryShadowPanel.tsx
      - name: Verify real V2, stock evidence, commitment reducer, read adapter and API boundaries
        run: node --experimental-strip-types --test tests/purchaseCycleReentryShadow.test.mjs tests/purchaseCycleReentryShadowIdentity.test.mjs tests/purchaseCycleReentryShadowSourceRecovery.test.mjs
      - name: Install isolated browser test tools only
        run: npm install --prefix "$RUNNER_TEMP/reentry-browser-tools" --no-package-lock --no-audit --no-fund esbuild@0.25.9 playwright@1.55.1
      - run: '"$RUNNER_TEMP/reentry-browser-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Real UI with mocked read-only API (no production writes)
        env:
          REENTRY_TEST_TOOLS_DIR: ${{ runner.temp }}/reentry-browser-tools
        run: node tests/purchaseCycleReentryShadow.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-reentry-shadow-ui
          path: artifacts/reentry-shadow-ui
          if-no-files-found: ignore
  production-readback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Allow the production rollout to finish
        run: sleep 120
      - name: Read production once and distinguish contract safety from source readiness
        run: node tests/purchaseCycleReentryShadow.production.mjs
