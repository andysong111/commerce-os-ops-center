name: SEO History Followup Once
on:
  push:
    branches: ['fix/legacy-seo-recovery-20260914']
    paths: ['.github/workflows/seo-history-followup-once.yml']
permissions:
  contents: write
jobs:
  verify-monotonic-history:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply reviewed regression update and guard both earlier rebalancers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/seo-contract-regression-refresh-once.yml').read_text()
          script=wf.split("          python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(script), 'reviewed-test-contract-refresh', 'exec'))
          p=Path('src/lib/keywordEngineElonFreshMallTitleComposer.ts')
          s=p.read_text()
          for function, warning, label in [
              ('composeKeywordElonIntentPortfolioV7','portfolioWarning','SEO_RUN_INTENT_PORTFOLIO_V7:kept_history_preference'),
              ('rebalanceKeywordElonMallTitleDiversityV8','diversityWarning','SEO_RUN_MALL_TITLE_DIVERSITY_V8:kept_history_preference')]:
              old=f'    selected = {function}({{'
              assert s.count(old)==1
              start=s.index(old)
              end=s.index('\n    });',start)+len('\n    });')
              block=s[start:end].replace('selected =', 'const proposed =',1)
              block+='\n    if (preservesKeywordElonHistoricalFreshness(selected, proposed, excludedTitles)) {\n      selected = proposed;\n    } else {\n      '+warning+' = "'+label+'";\n    }'
              s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          git diff --check
      - name: Execute all ledger behavior and bounded-recovery regressions
        run: >-
          node --experimental-strip-types --test
          tests/seoTitleInventoryLedger.test.mjs
          tests/seoTitleFinalKeywordInventoryGenerator.test.mjs
          tests/seoTitleV4MinLengthContract.test.mjs
          tests/keywordEngineElonLabSeoOutput.test.mjs
          tests/keywordEngineElonMallTitleSafeComposer.test.mjs
          tests/seoCategoryIntentExpansionV5.test.mjs
          tests/seoBulkMallTitleFactBridge.test.mjs
          tests/seoBulkCloudParallel.test.mjs
          tests/seoBulkLongTitleV6UpgradeBridge.test.mjs
          tests/seoRunDurableWorker.test.mjs
          tests/seoRunClaimLoadShedding.test.mjs
          tests/seoCloudPerformance.test.mjs
          tests/keywordEngineElonSelectionRecovery.test.mjs
          tests/keywordEngineElonMergeScoringState.test.mjs
          tests/keywordEngineElonDiscoveryIdentityPriority.test.mjs
      - name: Lint modified source and regression tests
        run: npx eslint src/lib/keywordEngineElonFreshMallTitleComposer.ts tests/seoBulkMallTitleFactBridge.test.mjs tests/seoTitleV4MinLengthContract.test.mjs tests/seoCategoryIntentExpansionV5.test.mjs tests/seoRunDurableWorker.test.mjs
      - name: Persist only fully passing source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/keywordEngineElonFreshMallTitleComposer.ts tests/seoBulkMallTitleFactBridge.test.mjs tests/seoTitleV4MinLengthContract.test.mjs tests/seoCategoryIntentExpansionV5.test.mjs tests/seoRunDurableWorker.test.mjs
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'fix: preserve achieved title freshness through all rebalancing layers'
          git push origin HEAD:refs/heads/fix/legacy-seo-recovery-20260914
