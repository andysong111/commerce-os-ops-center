name: Legacy SEO Final Incident Replay
on:
  push:
    branches: ['verify/legacy-seo-generation-only-20260914']
    paths: ['.github/workflows/legacy-seo-final-replay-once.yml']
permissions:
  contents: read
jobs:
  offline-replay:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Locate actual single-market composer call sites
        run: grep -Rn 'composeKeywordElonSafeMallTitles' src/lib
      - name: Execute production final composer against simplified incident fixtures (all fetch forbidden)
        shell: bash
        run: |
          mkdir -p /tmp/seo-final-replay
          cat > /tmp/seo-final-replay/loader.mjs <<'JS'
          import { existsSync } from 'node:fs';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import { resolve as pathResolve, extname } from 'node:path';
          export async function resolve(specifier, context, nextResolve) {
            let path;
            if (specifier.startsWith('@/')) path = pathResolve(process.env.GITHUB_WORKSPACE, 'src', specifier.slice(2));
            else if ((specifier.startsWith('./') || specifier.startsWith('../')) && context.parentURL?.startsWith('file:') && !extname(specifier)) path = fileURLToPath(new URL(specifier, context.parentURL));
            if (path) {
              const match = [path + '.ts', path + '.tsx', path + '.js', path + '/index.ts', path].find(existsSync);
              if (match) return nextResolve(pathToFileURL(match).href, context);
            }
            return nextResolve(specifier, context);
          }
          JS
          cat > /tmp/seo-final-replay/bootstrap.mjs <<'JS'
          import { register } from 'node:module';
          register('./loader.mjs', import.meta.url);
          JS
          cat > /tmp/seo-final-replay/replay.mjs <<'JS'
          import { pathToFileURL } from 'node:url';
          globalThis.fetch = async () => { throw new Error('OFFLINE_REPLAY_NETWORK_FORBIDDEN'); };
          const { composeKeywordElonBulkFinal } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/src/lib/keywordEngineElonBulkFinal.ts'));
          const { PRODUCT_GROUP_MARKET_REGISTRY } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/src/lib/productGroupMarketRegistry.ts'));
          console.log('REGISTRY_MARKET_COUNT', PRODUCT_GROUP_MARKET_REGISTRY.length);
          const samples = [
            { model: 'AAA106', name: '버드스파이크 A', core: '버드스파이크', anchor: '실외기·베란다용 비둘기·새퇴치 스파이크', category: '문구/취미/펫>조류용품>기타 조류용품', words: ['실외기베란다용비둘기새퇴치스파이크','버드스파이크','새퇴치스파이크','비둘기퇴치핀','실외기용새퇴치'] },
            { model: 'AAA109', name: '꽈배기 바지옷핀', core: '허리조절핀', anchor: '바지·치마용 허리조절핀', category: '가구/인테리어>홈패브릭/수예>수예용품>부자재', words: ['허리조절핀','바지허리조절핀','바지치마용허리조절핀','바지핀','치마허리조절핀'] },
          ];
          for (const sample of samples) {
            const candidates = sample.words.map((keyword,index) => ({ keyword,searchKey:keyword,searchKeyword:keyword,totalSearch:null,pcSearch:null,mobileSearch:null,compIdx:null,plAvgDepth:null,safetyPass:true,titleEligible:true,categoryAligned:true,relevance:98-index,categoryMatch:98-index,shoppingIntent:95-index,specificity:92-index,qualityScore:47-index,demandScore:15,competitionOpportunity:55,intentClass:'core_synonym',dataConfidence:'medium',sourceTags:['primary_seed'] }));
            const input = {
              launchItemId:'offline-fixture-'+sample.model,modelNumber:sample.model,productName:sample.name,sourceUrl:'shopling://legacy/offline-fixture',
              mallTitleCategory:sample.category,optionText:'',customBlockedTerms:[],variationSeed:'offline-replay-'+sample.model,excludedMallTitles:[],
              source:{url:'shopling://legacy/offline-fixture',offerId:'',autoStatus:'partial',chineseTitle:sample.name,optionText:'',supportingText:'',warnings:[],collectedAt:'2026-09-13T00:00:00Z'},
              collectionMode:'tracker_fallback',identity:{coreProduct:sample.core,identityAnchor:sample.anchor,koreanProductIdentity:sample.name,primarySeeds:sample.words,conditionalSeeds:[],functionModifiers:[],designShapeModifiers:[],specAttributes:[]},
              candidates,allowedKeys:sample.words,blockedKeys:[],finalMaterialCount:sample.words.length,titleResult:{title:sample.anchor,usedKeywords:sample.words,model:'offline-fixture',warning:'',byteLength:Buffer.byteLength(sample.anchor)},
            };
            try {
              const result = composeKeywordElonBulkFinal(input);
              console.log(JSON.stringify({model:sample.model,outcome:'ready',titleCount:result.seoFinal.mallTitles.length,searchCount:result.seoFinal.searchKeywords.length}));
            } catch (error) {
              console.log(JSON.stringify({model:sample.model,outcome:'threw',message:error.message,stack:error.stack}));
            }
          }
          JS
          node --experimental-strip-types --import /tmp/seo-final-replay/bootstrap.mjs /tmp/seo-final-replay/replay.mjs
