  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check group canary syntax
        run: >-
          node --check public/shopling-market-group-canary/background-root.mjs &&
          node --check public/shopling-market-group-canary/content-group-canary.mjs
      - name: Test group canary safety contract
        run: node --experimental-strip-types --test tests/shoplingMarketGroupCanary.test.mjs tests/shoplingMarketGroupCanaryV038.test.mjs tests/shoplingMarketGroupCanaryV039.test.mjs tests/shoplingMarketGroupCanaryV0310.test.mjs tests/shoplingMarketGroupCanaryV0311.test.mjs tests/shoplingMarketGroupCanaryV0312.test.mjs tests/shoplingMarketGroupCanaryV0313.test.mjs tests/shoplingMarketGroupCanaryV0314.test.mjs tests/shoplingMarketGroupCanaryV0315.test.mjs tests/shoplingMarketGroupCanaryV0316.test.mjs tests/shoplingMarketGroupCanaryV0317.test.mjs tests/shoplingMarketGroupCanaryV0318.test.mjs tests/shoplingMarketGroupCanaryV0319.test.mjs tests/shoplingMarketGroupCanaryV0320.test.mjs tests/shoplingMarketGroupCanaryV0321.test.mjs tests/shoplingMarketGroupCanaryV0322.test.mjs tests/shoplingMarketGroupCanaryV0323.test.mjs tests/shoplingMarketGroupCanaryV0324.test.mjs tests/shoplingMarketGroupCanaryV0325.test.mjs tests/shoplingMarketGroupCanaryV0326.test.mjs tests/shoplingMarketGroupCanaryV0327.test.mjs tests/shoplingMarketGroupCanaryV0328.test.mjs tests/shoplingMarketGroupCanaryV0329.test.mjs tests/shoplingMarketGroupCanaryV0330.test.mjs tests/shoplingMarketAutoResumePolicy.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://shopling-group-canary-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_shopling_group_canary_build_check
          SUPABASE_SECRET_KEY: sb_secret_shopling_group_canary_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
