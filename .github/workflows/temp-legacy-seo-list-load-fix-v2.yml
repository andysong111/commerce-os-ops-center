name: Temporary Legacy SEO List Load Fix V2
on:
  push:
    branches: ['fix/legacy-seo-list-load-20260913']
    paths: ['.github/workflows/temp-legacy-seo-list-load-fix-v2.yml']
permissions:
  contents: write
concurrency:
  group: temp-legacy-seo-list-load-fix-v2
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply bounded list-load patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              count = value.count(old)
              assert count == 1, f'{path}: expected one match, got {count}'
              p.write_text(value.replace(old, new, 1), encoding='utf-8')

          route = 'src/app/api/legacy-seo-run-jobs-lite/route.ts'
          replace(route, '      "input_payload",\n', '')
          replace(route, '      input_payload: record(row.input_payload),', '      input_payload: {},')
          replace(route, '      "exclusion_policy:item_payload->legacySeoRegistrationPolicy",\n', '')
          replace(route, '''  return (Array.isArray(body) ? body : [])\n    .map(record)\n    .filter((row) => !isExcluded(row.exclusion_policy))\n    .map((row) => ({''', '''  return (Array.isArray(body) ? body : [])\n    .map(record)\n    .map((row) => ({''')
          replace(route, '''  const includeItems = request.nextUrl.searchParams.get("items") !== "false";\n\n  const [jobs, items] = await Promise.all([\n    listCompactJobs(context.config, context.identity.userId),\n    includeItems\n      ? listLegacyItems(context.config, context.identity.userId)\n      : Promise.resolve([]),\n  ]);''', '''  const includeJobs = request.nextUrl.searchParams.get("jobs") !== "false";\n  const includeItems = request.nextUrl.searchParams.get("items") !== "false";\n\n  // Registration depends on the RUN ledger; the operator selection catalog is\n  // best-effort and must never blank FINAL rows when Product Launch storage is slow.\n  const [jobsResult, itemsResult] = await Promise.allSettled([\n    includeJobs\n      ? listCompactJobs(context.config, context.identity.userId)\n      : Promise.resolve([]),\n    includeItems\n      ? listLegacyItems(context.config, context.identity.userId)\n      : Promise.resolve([]),\n  ]);\n  if (includeJobs && jobsResult.status === "rejected") throw jobsResult.reason;\n  const jobs = jobsResult.status === "fulfilled" ? jobsResult.value : [];\n  const items = itemsResult.status === "fulfilled" ? itemsResult.value : [];\n  const warnings = itemsResult.status === "rejected"\n    ? ["이전상품 선택 목록 조회가 지연되어 SEO 작업원장만 표시합니다."]\n    : [];''')
          replace(route, '{ ok: true, jobs, items },', '{ ok: true, jobs, items, warnings },')

          client = 'src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx'
          replace(client, '''  const load = useCallback(async () => {\n    if (loadingRef.current) return;''', '''  const load = useCallback(async (includeItems = false) => {\n    if (loadingRef.current) return;''')
          replace(client, '''      }>(API);\n      setItems(Array.isArray(body.items) ? body.items : []);\n      setJobs(Array.isArray(body.jobs) ? body.jobs : []);''', '''      }>(`${API}?items=${includeItems ? "true" : "false"}`);\n      if (includeItems) setItems(Array.isArray(body.items) ? body.items : []);\n      setJobs(Array.isArray(body.jobs) ? body.jobs : []);''')
          replace(client, '''  useEffect(() => {\n    void load();\n    const timer = window.setInterval(() => void load(), POLL_MS);''', '''  useEffect(() => {\n    // The catalog changes rarely; poll only the compact RUN ledger every 5 seconds.\n    void load(true);\n    const timer = window.setInterval(() => void load(false), POLL_MS);''')
          replace(client, '            onClick={() => void load()}\n', '            onClick={() => void load(true)}\n')

          page = 'src/app/legacy-seo-bulk-cloud/page.tsx'
          replace(page, 'import LegacySeoSourceRecoveryEnhancer from "./LegacySeoSourceRecoveryEnhancer";\n', '')
          replace(page, '        <LegacySeoSourceRecoveryEnhancer />\n', '')

          test_path = Path('tests/legacySeoListLoadIsolation.test.mjs')
          assert not test_path.exists()
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nasync function source(path) {\n  return readFile(new URL(`../${path}`, import.meta.url), "utf8");\n}\n\ntest("legacy SEO polling isolates FINAL ledger from heavy catalog reads", async () => {\n  const lite = await source("src/app/api/legacy-seo-run-jobs-lite/route.ts");\n  const client = await source("src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx");\n  const page = await source("src/app/legacy-seo-bulk-cloud/page.tsx");\n  assert.doesNotMatch(lite, /\\"input_payload\\",/);\n  assert.doesNotMatch(lite, /item_payload->legacySeoRegistrationPolicy/);\n  assert.match(lite, /Promise\\.allSettled/);\n  assert.match(lite, /includeJobs/);\n  assert.match(lite, /warnings/);\n  assert.match(client, /load\\(true\\)/);\n  assert.match(client, /setInterval\\(\\(\\) => void load\\(false\\), POLL_MS\\)/);\n  assert.match(client, /\\?items=\\$\\{includeItems/);\n  assert.doesNotMatch(page, /LegacySeoSourceRecoveryEnhancer/);\n});\n''', encoding='utf-8')

          ci = '.github/workflows/legacy-seo-registration-ci.yml'
          replace(ci, "      - 'tests/legacySeoBulkLoading.test.mjs'\n", "      - 'tests/legacySeoBulkLoading.test.mjs'\n      - 'tests/legacySeoListLoadIsolation.test.mjs'\n")
          replace(ci, '          tests/legacySeoBulkLoading.test.mjs\n', '          tests/legacySeoBulkLoading.test.mjs\n          tests/legacySeoListLoadIsolation.test.mjs\n')
          PY
      - run: npm ci
      - name: Focused regression
        run: >-
          node --experimental-strip-types --test
          tests/legacySeoListLoadIsolation.test.mjs
          tests/legacySeoBulkLoading.test.mjs
          tests/legacySeoShoplingPayload.test.mjs
          tests/legacySeoShoplingPriceRecovery.test.mjs
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Commit tested patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-legacy-seo-list-load-fix.yml .github/workflows/temp-legacy-seo-list-load-fix-v2.yml
          git add src/app/api/legacy-seo-run-jobs-lite/route.ts src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx src/app/legacy-seo-bulk-cloud/page.tsx tests/legacySeoListLoadIsolation.test.mjs .github/workflows/legacy-seo-registration-ci.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate legacy SEO ledger polling from heavy catalog reads'
          git push origin HEAD:refs/heads/fix/legacy-seo-list-load-20260913
