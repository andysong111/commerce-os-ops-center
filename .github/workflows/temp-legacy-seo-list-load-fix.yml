name: Temporary Legacy SEO List Load Fix
on:
  push:
    branches: ['fix/legacy-seo-list-load-20260913']
    paths: ['.github/workflows/temp-legacy-seo-list-load-fix.yml']
permissions:
  contents: write
concurrency:
  group: temp-legacy-seo-list-load-fix
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply bounded list-load patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              count = value.count(old)
              assert count == 1, f'{path}: expected one match, got {count}'
              p.write_text(value.replace(old, new, 1), encoding='utf-8')

          route = 'src/app/api/legacy-seo-run-jobs-lite/route.ts'
          replace(route, '      "input_payload",\n', '')
          replace(route, '      input_payload: record(row.input_payload),', '      input_payload: {},')
          replace(route, '      "exclusion_policy:item_payload->legacySeoRegistrationPolicy",\n', '')
          replace(route, '''  return (Array.isArray(body) ? body : [])\n    .map(record)\n    .filter((row) => !isExcluded(row.exclusion_policy))\n    .map((row) => ({''', '''  return (Array.isArray(body) ? body : [])\n    .map(record)\n    .map((row) => ({''')
          replace(route, '''  const includeItems = request.nextUrl.searchParams.get("items") !== "false";\n\n  const [jobs, items] = await Promise.all([\n    listCompactJobs(context.config, context.identity.userId),\n    includeItems\n      ? listLegacyItems(context.config, context.identity.userId)\n      : Promise.resolve([]),\n  ]);''', '''  const includeJobs = request.nextUrl.searchParams.get("jobs") !== "false";\n  const includeItems = request.nextUrl.searchParams.get("items") !== "false";\n\n  // Jobs drive registration. Item discovery is operator convenience only, so an\n  // item-list timeout must never blank the SEO RUN ledger or disable registration.\n  const [jobsResult, itemsResult] = await Promise.allSettled([\n    includeJobs\n      ? listCompactJobs(context.config, context.identity.userId)\n      : Promise.resolve([]),\n    includeItems\n      ? listLegacyItems(context.config, context.identity.userId)\n      : Promise.resolve([]),\n  ]);\n  if (includeJobs && jobsResult.status === "rejected") {\n    throw jobsResult.reason;\n  }\n  const jobs = jobsResult.status === "fulfilled" ? jobsResult.value : [];\n  const items = itemsResult.status === "fulfilled" ? itemsResult.value : [];\n  const warnings = itemsResult.status === "rejected"\n    ? ["이전상품 선택 목록 조회가 지연되어 SEO 작업원장만 표시합니다."]\n    : [];''')
          replace(route, '{ ok: true, jobs, items },', '{ ok: true, jobs, items, warnings },')

          client = 'src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx'
          replace(client, '''  const load = useCallback(async () => {\n    if (loadingRef.current) return;''', '''  const load = useCallback(async (includeItems = false) => {\n    if (loadingRef.current) return;''')
          replace(client, '''      }>(API);\n      setItems(Array.isArray(body.items) ? body.items : []);\n      setJobs(Array.isArray(body.jobs) ? body.jobs : []);''', '''      }>(`${API}?items=${includeItems ? "true" : "false"}`);\n      if (includeItems) setItems(Array.isArray(body.items) ? body.items : []);\n      setJobs(Array.isArray(body.jobs) ? body.jobs : []);''')
          replace(client, '''  useEffect(() => {\n    void load();\n    const timer = window.setInterval(() => void load(), POLL_MS);''', '''  useEffect(() => {\n    // Load the operator selection catalog once. Five-second polling then refreshes\n    // only the compact RUN ledger so the page cannot hammer Product Launch storage.\n    void load(true);\n    const timer = window.setInterval(() => void load(false), POLL_MS);''')
          replace(client, '            onClick={() => void load()}\n', '            onClick={() => void load(true)}\n')

          page = 'src/app/legacy-seo-bulk-cloud/page.tsx'
          replace(page, 'import LegacySeoSourceRecoveryEnhancer from "./LegacySeoSourceRecoveryEnhancer";\n', '')
          replace(page, '        <LegacySeoSourceRecoveryEnhancer />\n', '')

          test = 'tests/legacySeoBulkLoading.test.mjs'
          p = Path(test)
          value = p.read_text(encoding='utf-8')
          marker = '''  assert.match(page, /<LegacySeoBulkListFetchShim \\/>/);\n});'''
          replacement = '''  assert.match(page, /<LegacySeoBulkListFetchShim \\/>/);\n  assert.doesNotMatch(page, /LegacySeoSourceRecoveryEnhancer/);\n  assert.doesNotMatch(lite, /input_payload,|item_payload->legacySeoRegistrationPolicy/);\n  assert.match(lite, /Promise\\.allSettled/);\n});'''
          assert marker in value
          value = value.replace(marker, replacement, 1)
          marker2 = '''  assert.match(client, /FINAL Shopling 신규등록 \\($\\{registerableJobs\\.length}건\\)/);\n});'''
          replacement2 = '''  assert.match(client, /FINAL Shopling 신규등록 \\($\\{registerableJobs\\.length}건\\)/);\n  assert.match(client, /load\\(true\\)/);\n  assert.match(client, /setInterval\\(\\(\\) => void load\\(false\\), POLL_MS\\)/);\n  assert.match(client, /\\?items=\\$\\{includeItems/);\n});'''
          assert marker2 in value
          p.write_text(value.replace(marker2, replacement2, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Focused regression
        run: >-
          node --experimental-strip-types --test
          tests/legacySeoBulkLoading.test.mjs
          tests/legacySeoShoplingPayload.test.mjs
          tests/legacySeoShoplingPriceRecovery.test.mjs
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Commit tested patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-legacy-seo-list-load-fix.yml
          git add src/app/api/legacy-seo-run-jobs-lite/route.ts src/app/legacy-seo-bulk-cloud/LegacySeoBulkCloudClient.tsx src/app/legacy-seo-bulk-cloud/page.tsx tests/legacySeoBulkLoading.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate legacy SEO ledger polling from heavy item recovery reads'
          git push origin HEAD:refs/heads/fix/legacy-seo-list-load-20260913
